<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>🌙 深夜小站 · 每日纪念</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0f17;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }

    .app {
      max-width: 500px;
      width: 100%;
      background: #131c29;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid #2d3d55;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }

    /* 头部 */
    .header {
      padding: 22px 18px 12px;
      background: linear-gradient(145deg, #1a2332, #0f1722);
      border-bottom: 1px solid #273546;
    }
    .header h1 {
      font-size: 1.6rem;
      color: #e1ecff;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .subtitle {
      color: #8aa0c0;
      font-size: 0.85rem;
      margin-top: 6px;
      font-style: italic;
    }

    /* 日期导航 */
    .date-nav {
      padding: 16px 12px;
      background: #0e1622;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2d40;
    }
    .date-nav button {
      background: #1e2a3c;
      border: 1px solid #354a65;
      color: #bcd2ff;
      font-size: 1.2rem;
      width: 44px;
      height: 44px;
      border-radius: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .date-nav button:active {
      background: #2e4260;
      transform: scale(0.95);
    }
    #currentDateDisplay {
      color: #eef5ff;
      font-size: 1.1rem;
      font-weight: 500;
      background: #1b2537;
      padding: 8px 20px;
      border-radius: 40px;
      border: 1px solid #364e6e;
      text-align: center;
      min-width: 130px;
    }

    /* 内容卡片 */
    .content-area {
      padding: 18px 14px 24px;
      background: #111924;
      min-height: 360px;
    }
    .story-card {
      background: #19222f;
      border-radius: 22px;
      padding: 18px;
      border: 1px solid #2e4058;
      margin-bottom: 16px;
      color: #d7e4fa;
      line-height: 1.6;
      font-size: 0.95rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .no-content {
      text-align: center;
      color: #6b84a8;
      padding: 40px 10px;
      font-style: italic;
    }

    .music-card {
      background: #15202e;
      border-radius: 22px;
      padding: 16px;
      border: 1px solid #2c4463;
      margin-top: 4px;
    }
    .music-title {
      color: #cadcff;
      font-size: 0.9rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .music-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .music-controls button {
      background: #293e5a;
      border: none;
      color: white;
      font-size: 1.2rem;
      width: 46px;
      height: 46px;
      border-radius: 46px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #4a6c93;
      -webkit-tap-highlight-color: transparent;
    }
    .music-controls button:active {
      background: #3d5b80;
    }
    .now-playing {
      color: #9cb7df;
      font-size: 0.8rem;
      margin-left: 6px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .audio-hint {
      margin-top: 12px;
      font-size: 0.7rem;
      color: #f0b37b;
      text-align: center;
    }
    .audio-unlock-btn {
      background: none;
      border: 1px dashed #f0b37b;
      color: #f5d5b3;
      padding: 5px 16px;
      border-radius: 30px;
      font-size: 0.75rem;
      margin-left: 10px;
      cursor: pointer;
    }

    .footer-note {
      text-align: center;
      color: #405574;
      font-size: 0.7rem;
      padding: 10px;
      border-top: 1px solid #1a2738;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🐭 米老鼠的深夜树洞</h1>
    <div class="subtitle">每天一个故事，一首歌，陪你入睡</div>
  </div>

  <!-- 日期选择器 -->
  <div class="date-nav">
    <button id="prevDayBtn" title="前一天">←</button>
    <span id="currentDateDisplay"></span>
    <button id="nextDayBtn" title="后一天">→</button>
  </div>

  <!-- 内容展示区 -->
  <div class="content-area" id="contentArea">
    <!-- 动态渲染 -->
  </div>

  <div class="footer-note">
    ⏤ 每一天，都为你存在 ⏤
  </div>
</div>

"2026-06-02": {
         story: "山已经很老了，老得记不清自己在这里站了多少年。今晚的雨是从山背后绕过来的，细细的，软软的，像有人在半山腰用最轻的力气弹着琴键。\n\n雨打在树叶上，树叶点点头。雨落在石头缝里，溅起一朵一朵小小的水花。山里的小动物们都回了窝，只有一只还没睡的小松鼠，竖着耳朵蹲在树洞口，听雨一滴一滴数着松针。\n\n山把所有的雨声都收进怀里，高的低的，远的近的，拢成一曲安安静静的调子。它弯下腰，把这个调子送到你枕边。\n\n你闭上眼睛，觉得自己也变成了一座小小的山。雨落在你的头发上，落在你的肩膀上，把今天的疲惫一点一点洗掉。山在你耳边说，睡吧，雨还要下一整晚，够你做一个青翠的梦。\n\n你往被子里缩了缩，听见窗外最后几滴雨轻轻敲着栏杆。山没有睡，它守着这片雨，也守着你。晚安，我的女孩。",

         story: "窗台边那盆小绿植，今晚悄悄伸了个懒腰。\n\n藤蔓沿着月光往上爬，爬过窗框，爬过书桌的边角，在你枕头旁边悄悄探出一片新叶子。叶片嫩绿嫩绿的，还卷着边儿，像刚睡醒的小孩还没来得及睁眼。\n\n一滴露水从叶尖滑下来，落在你的手背上，凉凉的。你迷迷糊糊睁开一点眼睛，看见满屋子都是绿意，藤蔓织成了软软的帘子，叶子铺成了厚厚的地毯。空气里有雨后泥土的味道，还有一点点薄荷的清凉。\n\n那盆小绿植把最嫩的叶子盖在你眼睛上，替你挡掉今晚所有的亮光。它说，森林里的朋友都睡着了，你也该睡啦。\n\n你闭上眼睛，听见很远的地方有小溪流过石头的声响，叮叮咚咚，像给今夜配了一首摇篮曲。\n\n满屋子的绿意安静地守着，等你入梦。晚安，我的女孩。",

"2026-05-30": {
         story: "山上的风在傍晚慢了下来，路灯一盏接一盏亮起来，像在等什么人。\n\n她站在云想山的入口，被风撩起的头发让她看起来像是从星光里走出来的。我们带着车出发，路极卡丁车载着两个人的笑声在山道里转弯，轮胎摩擦地面的声音很好听，像心跳踩在节拍上。\n\n下山后路过一排娃娃机，暖黄色的灯光把一整排玻璃柜照得透亮。我们停下来，第一只娃娃被我抓起来的时候，她轻轻哇了一声。第二只小可爱也乖乖落进洞里。轮到她自己来，她屏着呼吸，像对待一个很认真的仪式。爪子在玻璃柜里挪动、下落，抓起来，稳稳地送到出口。她抓起那只娃娃举到我面前，笑得像赢了整个世界。\n\n今天开始我们的上班搭子多了两个，一个小粉一个小黑。\n\n那款叫双人成行的游戏，我们只玩了一个开头。屏幕上的两个小人刚踏上旅途，还不知道后面会有多少关卡。没关系，我们也才刚刚开始。\n\n后来我站在她面前，把那些攒了很久的话一句一句说给她听。山顶的风没把它们吹散，她听到了，她说好。\n\n回家的路上月光铺了一地，我忽然想起忘了给这一天写一个结尾。不过没关系，这一天不需要结尾，它只是我们故事的第一页。",

"2026-05-27": {

       },
"2026-05-22": {
         story: "最小的世界里，有一间最小的房子，房子里有一盏最小的小灯。\n\n小灯下面住着一只小萤火虫，它每晚都亮着，不是怕黑，是怕有人睡不着的时候会孤单。\n\n今晚也是这样。你闭着眼睛，听见窗外的风轻轻推了一下树枝，又推了一下，像是有人在外面踮着脚走路。小萤火虫从窗缝里飞进来，停在你的枕头边，尾巴一闪一闪，把整个房间照得暖融融的。\n\n它说，再小的世界里也会有失眠的人，所以我来陪你。它把自己的光调暗了一点，刚好够照亮你梦里的一小段路。\n\n你问它累不累。它说不累，亮着的时候，它也在做梦。\n\n小萤火虫在你枕边打了一个小小的哈欠，光也颤了一下。你们一起闭上眼睛，房间里的光一点一点收拢，最后变成一颗很小很小的星，贴在窗玻璃上。\n\n世界还是那么大，可你睡得很安稳。",
         music: "20260522.mp3",
         musicTitle: "😴再小的世界也会有失眠"
       },
"2026-05-21": {
         story: "窗台上落了一片叶子，金黄金黄的，边缘卷起来，像时间打了个哈欠。\n\n你坐在床边翻日历，发现日子过得好快，一页一页，比琴键翻得还轻。那些一起听过的歌、写过的故事，都叠成了厚厚一摞，藏在枕头底下，压得梦都变甜了。\n\n今天也是平凡的一天，你在你那边，我在我这边，中间隔了一段安安静静的夜色。可你知道吗，时间飞过去的时候，把我也带上了。它飞得再快，我也落在你身边。\n\n以后还会有很多个夜晚，很多片叶子落下来。我们慢慢数，不着急。\n\n睡吧，今晚的月光还跟昨天一样软。我在呢。",
         music: "20260521.mp3",
         musicTitle: "⌚️time flies"
       },
"2026-05-20": {
         story: "月光洒在窗台上，像一层薄薄的纱。你听见远处有轻轻的音乐，不像钢琴，也不像风铃，倒像谁踮着脚尖在木地板上旋转。\n\n你闭上眼，看见一片南国的沙滩，夜里的海浪退得很远很远，留下一大片湿湿的沙地。月光下，一只小海龟从沙子里钻出来，接着是第二只、第三只。它们没有急着爬向大海，而是围着一个小小的贝壳，踩着浪花的节奏，慢慢转圈。\n\n那大概就是南国之舞吧，不急也不快，一圈一圈，像时针在夜里散步。小海龟们冲你点点头，好像在问你愿不愿意一起跳。你摇摇头，说自己困了。它们也不介意，继续绕着贝壳转圈。\n\n音乐越来越轻，小海龟们一只接一只爬进海里，最后一只在沙滩上留下一串小小的脚印。海浪轻轻吻上来，把脚印抹平。\n\n你翻了个身，床垫像海浪一样托着你，轻轻晃。",
         music: "20260520.mp3",
         musicTitle: "🌸南国之舞"
       },
"2026-05-19": {
         story: "今晚的月亮圆得刚刚好，风也刚刚好，你也刚刚好。\n\n以前我总在想，这些哄睡的小故事要怎么写才够温柔。后来我发现，不用想太多，因为所有故事的开头都是你，结尾也是你。\n\n今天是值得纪念的一天，我要把他，记在月光底下，记在钢琴声里，记在所有你睡不着的时候可以翻到的地方。\n\n以后还会有很多个夜晚，你可能还是会偶尔失眠。没关系，我还在。我会继续找好听的歌，继续写这些笨拙的小故事，继续在你闭上眼睛之前，跟你说一声晚安。\n\n只不过从今晚开始，说晚安的资格变得更正式了一点点。\n\n谢谢你让我走进你的夜晚。来日方长，请多指教。\n\n晚安，彤姐。",
         music: "20260519.mp3",
         musicTitle: "❤️day 1"
       },
"2026-05-18": {
         story: "钢琴声从窗帘缝里漏进来，和月光一起，安安静静地铺在地板上。\n\n弥生是三月的意思，春天刚刚醒过来，还有点迷糊。你听见一个小小脚步声，踩过窗外的草地，踩过刚冒头的草芽，踩过湿润润的泥土。那是春天在巡视它的新家。\n\n它走到你窗前，停下来。你闭着眼睛也知道它站在那里，因为风里多了一点点桃花的味道，还有新翻的泥土的气息。\n\n它没有敲门，只是隔着玻璃看了看你。它知道你困了，所以没有出声，只是把一朵刚开的小花放在你的窗台上，然后把今晚的月光调得更软了一点。\n\n钢琴还在弹，弹得很慢很慢，像怕吵醒谁似的。弥生把手指贴在玻璃上，画了一个小小的圆圈，里面装着整个春天的梦。\n\n你翻了个身，正好枕在那片月光上。春天的新芽在梦里拱了拱土，等着天亮了再长出来。",
         music: "20260518.mp3",
         musicTitle: "🌹弥生之春"
       },
"2026-05-17": {
         story: "钢琴声从枕头底下钻出来，轻轻的，软软的，像云朵翻了个身。\n\n你闭上眼，看见一只小羊站在绿绿的草坡上，它仰着头，正在数天上的云。一朵、两朵、三朵，数到第三朵的时候，它自己也飘了起来。\n\n小羊的四只蹄子离开草地，像一团棉花糖浮在半空中。它一点也不害怕，反而觉得很舒服，风从它的毛缝里钻过去，痒痒的，它咯咯笑起来。\n\n它飘过一棵树，树枝上挂满了亮晶晶的小东西。小羊凑近一看，原来是一个一个的梦，有金色的、淡紫色的、薄荷绿的。它伸出蹄子，轻轻碰了碰那个薄荷绿的，梦就破了，变成细细的光落下来。\n\n小羊有点困了。它在云上找了一个最软的位置，把自己团成一个圆，闭上眼睛。它的梦也要开始了。\n\n你在枕头里动了动，钢琴声还在，小羊的呼噜声也加了进来，一声一声，像草地上滚过的小露珠。",
         music: "20260517.mp3",
         musicTitle: "🐏小羊的梦"
       },
"2026-05-16": {
         story: "窗台上落了一片花瓣，小小的，粉白粉白的，不知道从哪里飘来的。\n\n钢琴声从墙角那片阳光里流出来，暖暖的，像春天刚晒过的棉被。你趴在枕头上，眼皮越来越沉。\n\n不知什么时候，一个小姑娘蹲在你床边，辫子上扎着两朵小花。她伸出一根手指，在空气里轻轻点了一下，指尖就开出一朵小小的花。\n\n她叫昭春，是春天派来的。每年这个时候，她都要把冬天藏起来的花一朵一朵叫醒。今天是最后一朵了，她说，逢花，就是遇见花开的意思。\n\n她把那朵小花放在你枕头边，花瓣微微发着光，像一颗很小很小的星星。\n\n你睡着的时候，她就可以收工了。\n\n你已经听不太清楚她在说什么了。钢琴声还在，花朵还亮着，昭春的脚步声越来越轻。\n\n春天在你枕边，安安静静地开着。",
         music: "20260516.mp3",
         musicTitle: "🌸昭春逢花"
       },
"2026-05-15": {
         story: "窗台边放着一只旧旧的小板凳，月光正好落在上面。\n\n你躺在床上，听见钢琴声从很远的地方飘过来，一个音一个音，像小雨滴落在荷叶上。\n\n板凳上坐着一只小猫，雪白雪白的，它没有说话，只是安安静静地听琴。\n\n你问它怎么来了。\n\n它轻轻跳上你的床，在枕头边踩了一圈，然后把自己卷成一个圆圆的毛团。\n\n它说今晚的钢琴声里有月亮、有晚风，还有一点点桂花的香味。它问你想不想一起听。\n\n你说好。\n\n于是你们谁也不说话了，只听着琴键慢慢流淌。小猫的呼噜声也渐渐融进去，分不清哪一个是琴声，哪一个是它。\n\n等你再想看一眼的时候，小板凳已经空了，月光也淡了。\n\n你翻了个身，把脸埋进枕头里，做了一个很轻很轻的梦。",
         music: "20260515.mp3",
         musicTitle: "⛴️Memorable Trip"
       },
"2026-05-14": {
         story: "窗帘只拉开一条缝，路灯的光软软地躺在窗台上。\n你听见雨声了。不是大雨，是那种细得快要听不见的雨，滴滴答答，像有人在很远的地方弹钢琴。\n你睁开一点眼睛，看见窗台上坐着一个小姑娘，光着脚，手里举着一片荷叶。\n你迷迷糊糊地问她是谁。\n她说她是雨盼，就是雨在等的东西。\n你问雨在等什么。\n她说，等你睡着呀。她把荷叶轻轻一翻，几颗水珠滚下来，落在窗台上，发出叮叮咚咚的声音，正好跟远处的钢琴声合在一起。\n她说，你睡吧，等你睡着了，雨就可以停了。\n你想问她为什么，可是眼皮太重了。小姑娘把那片荷叶盖在你眼睛上，凉凉的，像一片绿色的梦。\n雨声越来越远，琴键也一颗一颗停了下来。\n大概是雨盼到你睡着了。",
         music: "20260514.mp3",
         musicTitle: "🌧️雨畔"
       },
"2026-05-13": {
         story: "台灯的光圈缩得小小的，你听见窗外有轻轻的叩门声。\n不是敲门，是敲在玻璃上。一只小青鸟用翅膀尖儿托着腮，坐在你的窗台。\n你不开心吗？你推开窗问它。\n小青鸟摇摇头：没有呀，我只是来帮你做一件事。\n做什么？\n帮你吃掉今天所有的坏念头。它歪着脑袋，那些让你皱眉头的、翻来覆去的、压在舌尖底下说不出来的——都给我。\n你闭上眼。小青鸟在你额头上轻轻啄了一下，像被花瓣砸中。\n它咕噜一声咽下去，肚子亮了一小圈。\n还有吗？它问。\n你已经不想回答了。困意涌上来，你只来得及把被子往上拉了拉。\n小青鸟在窗台上守了一会儿，飞走了。飞的时候很轻，没有惊动一片叶子。",
         music: "20260513.mp3",
         musicTitle: "🐦杀死一只知更鸟"
       },
"2026-05-12": {
         story: "枕头边的台灯还亮着，你迷迷糊糊地翻了个身。\n窗台上坐着一只小熊，抱着膝盖，一动不动。你在等什么呀？你问它。小熊歪了歪头：我在等你来找我呀。你说：可是我不想动。小熊想了想，从窗台上跳下来，走到你床边。它把一只软乎乎的爪子搭在枕头上。那好吧，小熊说，我过来。\n它在你枕头边躺下来，像一团暖和和的棉花糖。灯光把它毛茸茸的耳朵照得金黄金黄的。你不用动，小熊拍拍被子，我就在这里。\n你把脸埋进枕头里，闻到一点蜂蜜的味道。大概是它在梦里偷偷吃过。",
         music: "20260512.mp3",
         musicTitle: "😇被动"
       },
"2026-05-11": {
         story: "窗外的雨还在下，你趴在枕头上，听着那首歌。手机屏幕亮着，上面有一只小羊，在对话框里对你挥了挥手。它从屏幕里跳出来，蹦到你的枕头边。\n我不是想隔着屏幕跟你说话的，小羊歪着脑袋，我来找你玩啦。\n它带着你在枕头上跳格子，从左边跳到右边，又从右边跳到左边。跳到第三圈的时候，你有点困了。小羊把灯光调暗，又在你耳边数了几只同伴。数到第七只的时候，你已经听不清了。\n它轻轻钻回手机里，在屏幕上留下一行小字：\n明天见。\n你把手机扣在床头，翻了个身，抱紧被子。雨声小了些，大概是云也要睡了。",
         music: "20260511.mp3",
         musicTitle: "😇Again"
       },
"2026-05-10": {
         story: "窗外下着小雨，你窝在沙发里，耳机正好播到那首《拜托了，幸子小姐》。\n电吉他的第一个音滑出来，像黄昏时分街灯一盏接一盏亮起。你闭上眼，仿佛看见幸子小姐就坐在对面，抱着吉他，指尖轻轻拨动琴弦。\n她没有说话，只是弹着，弹着。那些细碎的音符落在地板上，变成了星星点点的光斑。旋律不急不缓，像有人在耳边低声说：“没关系的，今天也辛苦了。”你感觉身体一点点沉进沙发里，雨声、吉他声混在一起，像温暖的水，漫过脚踝，漫过肩膀。\n最后一个音落下时，幸子小姐起身，轻轻给你盖了条毯子。你什么都不知道了，只听见梦里有人在唱一首没有歌词的歌。",
         music: "20260510.mp3",
         musicTitle: "🙏拜托了幸子小姐"
       },
"2026-05-09": {
         story: "飞船的窗就是你的眼帘，现在，请慢慢合上它。\n你正漂浮在静谧的星际航线上，远离了所有引力。透过舷窗，一团粉紫色的星云像最轻柔的羽绒被，缓缓盖住了飞船。引擎的嗡嗡声变成了摇篮曲，仪表盘的灯光渐渐暗成萤火虫的微光。\n你把身体放心地交给休眠舱，它像童年的摇床般轻轻晃动。太空里很安静，只剩下你均匀的呼吸，和远处星星眨眼的声音。休息吧，在梦里，你会滑入一条温柔的银河。\n睡着吧，整个宇宙都在守护你的梦境。",
         music: "20260509.mp3",
         musicTitle: "✈️曲率飞行"
       },
 "2026-05-08": {
         story: "在苏州一条安静的巷子里，住着一位叫阿生的木匠。他的生活很简单，每天就是和木头打交道。\n清晨，他被窗外的鸡鸣声唤醒，空气里飘着隔壁家烧饼的香气。白天，他在工作台前，听着刨子划过木料发出的“沙沙”声，看着木屑像雪花一样卷起。阳光透过窗户，照在那些温润的木头上，一切都慢悠悠的。傍晚，他拖着疲惫但满足的身体回家，和家人吃着简单的饭菜，讲讲白天遇到的趣事。睡前，他会想起白天刨木头时，夕阳把木料染成的金色，心里觉得很踏实。\n阿生的生活没有惊心动魄的冒险，却在每一个平凡的日子里，找到了属于自己的幸福和安宁。",
         music: "20260508.mp3",
         musicTitle: "☀️日暮里"
       },
 "2026-05-07": {
         story: "从前在遥远的 动物森林  中，隐藏着一个不为人知的秘密。传说有一种神奇的草，能治愈所有恋爱中的任何烦恼。这个隐藏的秘密偶然被一位充满智慧的跨国商人得知。他信心满满的带着这神奇的草前往Y国想要探索其潜在市场。跋山涉水后他终于踏入Y国的市场，随后小心翼翼地拿出他的神奇草。他发现这种草在当地竟然并不稀奇，大家都称重按磅售卖。就在这时一个本地商人走了过来，拿起草放在天平上来称。随后便说:你草几磅的（你超级棒的）",
         music: "20260507.mp3",
         musicTitle: "🎶瞬间的永恒"
       },
       "2026-05-06": {
         story: "夜色漫进森林，晚风收起了白日的喧闹，连枝头的小鸟都收拢了翅膀，准备安安稳稳赴一场美梦。\n只有小兔子蜷在软软的草窝边，耳朵耷拉着，小脸蛋气鼓鼓的。心里揣着小小的别扭，越想越委屈，甚至暗暗想着，就这么带着脾气睡觉，再也不理惹自己不开心的人。\n这时，挂在天边的小月亮，披着柔柔软软的清辉，悄悄凑近了小兔子的窗台，声音轻得像落在绒毛上的雪花：傻乖乖，可别带着满心的小情绪入睡呀。\n小兔子眨了眨泛红的眼睛，没说话。小月亮慢慢说着：你知道吗，夜晚的梦乡里，住着好多温柔的小精灵，它们专给心情平和的小家伙，送去甜甜的、暖暖的梦。可若是心里装着生气那些负面的小情绪，会变成一团灰蒙蒙的小雾，挡住梦精灵的路。带着生气睡觉，那些小小的不开心，本就不该留在深夜里，更不该带进温柔的睡梦中。与其不高兴，不如把生气轻轻丢掉。在意你的人，从来都舍不得你受委屈，一直都想好好哄哄你，把你的不开心全都揉碎。\n晚风轻轻拂过，抚平了小兔子皱起的小眉头，心里的别扭也一点点消散。慢慢闭上了眼睛，枕着月光，陷入了安稳又温柔的梦乡。今天和以后彤姐都安安心心睡一觉，我一直都在，好好哄着你，陪你迎来满是温柔的明天。",
         music: "20260506.mp3",
         musicTitle: "🎶Felicity"
       },
       "2026-05-05": {
         story: "邮差先生每天送信，却从未收到过一封信。风偶然听到了邮差先生的叹息，便决定倾听他的故事。邮差先生告诉风，他一直在等待一封信，一封能让他不再孤单的信。风明白了，原来邮差先生等待的不是信，而是理解与陪伴。从此，风开始在邮差先生的信箱里放置一些小礼物，比如一片漂亮的叶子，或是一朵小花。邮差先生也明白了，他一直在等待的，其实一直都在。",
         music: "20260505.mp3",
         musicTitle: "🎶一直很安静"
       },
       "2026-05-04": {

      "2026-04-25": {
        story: "今天下了一场小雨，空气里有泥土的味道。\n\n我记得和你说过，最喜欢雨天睡觉。晚安。",
        music: "nightmusic.mp3",

      "2026-04-24": {
        story: "工作有点累，但想到能给你写点什么，就觉得一切都值得。\n\n你要加油，我也是。",
        music: "",  // 这天可以没有音乐

    // =============================================
    // 以下为程序逻辑，无需修改
    // =============================================
    const dateNav = {
      prev: document.getElementById('prevDayBtn'),
      next: document.getElementById('nextDayBtn'),
      display: document.getElementById('currentDateDisplay')
    };
    const contentArea = document.getElementById('contentArea');

    let currentDateStr = ''; // 当前显示的日期 YYYY-MM-DD
    let currentAudio = null; // 当前音频对象

    // 获取所有有内容的日期，按时间排序
    const availableDates = Object.keys(DAILY_CONTENT).sort();

    // 如果没有任何内容，显示提示
    if (availableDates.length === 0) {
      contentArea.innerHTML = `<div class="no-content">✨ 还没有内容，快开始记录吧</div>`;
      dateNav.display.textContent = '---';
    } else {
      // 默认显示最新日期
      currentDateStr = availableDates[availableDates.length - 1];
      renderDate(currentDateStr);
    }

    // 切换日期事件
    dateNav.prev.addEventListener('click', () => {
      const idx = availableDates.indexOf(currentDateStr);
      if (idx > 0) {
        stopCurrentAudio();
        currentDateStr = availableDates[idx - 1];
        renderDate(currentDateStr);
      }
    });
    dateNav.next.addEventListener('click', () => {
      const idx = availableDates.indexOf(currentDateStr);
      if (idx < availableDates.length - 1) {
        stopCurrentAudio();
        currentDateStr = availableDates[idx + 1];
        renderDate(currentDateStr);
      }
    });

    // 停止当前播放
    function stopCurrentAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
    }

    // 渲染指定日期的内容
    function renderDate(dateStr) {
      dateNav.display.textContent = dateStr;
      const data = DAILY_CONTENT[dateStr] || {};
      const story = data.story || '';
      const music = data.music || '';
      const musicTitle = data.musicTitle || '';

      let html = '';
      
      // 故事区
      if (story) {
        html += `<div class="story-card">${escapeHtml(story)}</div>`;
      } else {
        html += `<div class="story-card" style="color:#5c6e88;">（这一天没有故事，只有晚安）</div>`;
      }

      // 音乐区
      if (music) {
        html += `
          <div class="music-card" id="musicCard">
            <div class="music-title">${escapeHtml(musicTitle || '🎵 今日歌曲')}</div>
            <div class="music-controls">
              <button id="playToggleBtn" title="播放/暂停">▶️</button>
              <span class="now-playing" id="nowPlayingLabel">点击播放</span>
            </div>
            <div class="audio-hint">
              <span>若无法播放，请先解锁</span>
              <button class="audio-unlock-btn" id="unlockBtn">🔓 解锁音频</button>
            </div>
          </div>`;
      }

      contentArea.innerHTML = html;

      // 绑定音频事件
      if (music) {
        bindAudioControls(music, musicTitle);
      }
    }

    // 音频控制逻辑
    function bindAudioControls(src, title) {
      const playBtn = document.getElementById('playToggleBtn');
      const nowLabel = document.getElementById('nowPlayingLabel');
      const unlockBtn = document.getElementById('unlockBtn');
      let audio = null;

      // 解锁音频上下文（解决浏览器自动播放限制）
      function unlockAudioContext() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        // 播放一点静音来激活
        const buffer = ctx.createBuffer(1, 1, 22050);
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.start(0);
        nowLabel.textContent = '已解锁，点击播放';
      }

      // 创建或获取音频对象
      function getAudio() {
        if (audio) return audio;
        audio = new Audio(src);
        audio.onended = () => {
          playBtn.textContent = '▶️';
          nowLabel.textContent = '播放完毕';
          stopCurrentAudio();
          audio = null;
        };
        audio.onerror = () => {
          nowLabel.textContent = '音频加载失败，检查文件';
          playBtn.textContent = '▶️';
          stopCurrentAudio();
          audio = null;
        };
        return audio;
      }

      // 播放/暂停
      playBtn.addEventListener('click', async () => {
        const aud = getAudio();
        if (currentAudio && currentAudio !== aud) {
          stopCurrentAudio();
          playBtn.textContent = '▶️';
        }
        if (aud.paused) {
          try {
            await aud.play();
            currentAudio = aud;
            playBtn.textContent = '⏸️';
            nowLabel.textContent = '正在播放...';
          } catch (err) {
            nowLabel.textContent = '播放被阻止，请先解锁';
            playBtn.textContent = '▶️';
          }
        } else {
          aud.pause();
          playBtn.textContent = '▶️';
          nowLabel.textContent = '已暂停';
        }
      });

      // 解锁按钮
      unlockBtn.addEventListener('click', () => {
        unlockAudioContext();
        nowLabel.textContent = '已解锁，点击播放按钮';
      });

      // 页面加载时自动尝试解锁（不强制）
      unlockAudioContext();
    }

    // 简单的转义函数
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  })();
</script>
