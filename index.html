<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>🌙 深夜小站 · 每日纪念</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0f17;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }

    .app {
      max-width: 500px;
      width: 100%;
      background: #131c29;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid #2d3d55;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }

    /* 头部 */
    .header {
      padding: 22px 18px 12px;
      background: linear-gradient(145deg, #1a2332, #0f1722);
      border-bottom: 1px solid #273546;
    }
    .header h1 {
      font-size: 1.6rem;
      color: #e1ecff;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .subtitle {
      color: #8aa0c0;
      font-size: 0.85rem;
      margin-top: 6px;
      font-style: italic;
    }

    /* 日期导航 */
    .date-nav {
      padding: 16px 12px;
      background: #0e1622;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2d40;
    }
    .date-nav button {
      background: #1e2a3c;
      border: 1px solid #354a65;
      color: #bcd2ff;
      font-size: 1.2rem;
      width: 44px;
      height: 44px;
      border-radius: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .date-nav button:active {
      background: #2e4260;
      transform: scale(0.95);
    }
    #currentDateDisplay {
      color: #eef5ff;
      font-size: 1.1rem;
      font-weight: 500;
      background: #1b2537;
      padding: 8px 20px;
      border-radius: 40px;
      border: 1px solid #364e6e;
      text-align: center;
      min-width: 130px;
    }

    /* 内容卡片 */
    .content-area {
      padding: 18px 14px 24px;
      background: #111924;
      min-height: 360px;
    }
    .story-card {
      background: #19222f;
      border-radius: 22px;
      padding: 18px;
      border: 1px solid #2e4058;
      margin-bottom: 16px;
      color: #d7e4fa;
      line-height: 1.6;
      font-size: 0.95rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .no-content {
      text-align: center;
      color: #6b84a8;
      padding: 40px 10px;
      font-style: italic;
    }

    .music-card {
      background: #15202e;
      border-radius: 22px;
      padding: 16px;
      border: 1px solid #2c4463;
      margin-top: 4px;
    }
    .music-title {
      color: #cadcff;
      font-size: 0.9rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .music-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .music-controls button {
      background: #293e5a;
      border: none;
      color: white;
      font-size: 1.2rem;
      width: 46px;
      height: 46px;
      border-radius: 46px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #4a6c93;
      -webkit-tap-highlight-color: transparent;
    }
    .music-controls button:active {
      background: #3d5b80;
    }
    .now-playing {
      color: #9cb7df;
      font-size: 0.8rem;
      margin-left: 6px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .audio-hint {
      margin-top: 12px;
      font-size: 0.7rem;
      color: #f0b37b;
      text-align: center;
    }
    .audio-unlock-btn {
      background: none;
      border: 1px dashed #f0b37b;
      color: #f5d5b3;
      padding: 5px 16px;
      border-radius: 30px;
      font-size: 0.75rem;
      margin-left: 10px;
      cursor: pointer;
    }

    .footer-note {
      text-align: center;
      color: #405574;
      font-size: 0.7rem;
      padding: 10px;
      border-top: 1px solid #1a2738;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🐭 米老鼠的深夜树洞</h1>
    <div class="subtitle">每天一个故事，一首歌，陪你入睡</div>
  </div>

  <!-- 日期选择器 -->
  <div class="date-nav">
    <button id="prevDayBtn" title="前一天">←</button>
    <span id="currentDateDisplay"></span>
    <button id="nextDayBtn" title="后一天">→</button>
  </div>

  <!-- 内容展示区 -->
  <div class="content-area" id="contentArea">
    <!-- 动态渲染 -->
  </div>

  <div class="footer-note">
    ⏤ 每一天，都为你存在 ⏤
  </div>
</div>

         story: "窗台边放着一只旧旧的小板凳，月光正好落在上面。\n\n你躺在床上，听见钢琴声从很远的地方飘过来，一个音一个音，像小雨滴落在荷叶上。\n\n板凳上坐着一只小猫，雪白雪白的，它没有说话，只是安安静静地听琴。\n\n你问它怎么来了。\n\n它轻轻跳上你的床，在枕头边踩了一圈，然后把自己卷成一个圆圆的毛团。\n\n它说今晚的钢琴声里有月亮、有晚风，还有一点点桂花的香味。它问你想不想一起听。\n\n你说好。\n\n于是你们谁也不说话了，只听着琴键慢慢流淌。小猫的呼噜声也渐渐融进去，分不清哪一个是琴声，哪一个是它。\n\n等你再想看一眼的时候，小板凳已经空了，月光也淡了。\n\n你翻了个身，把脸埋进枕头里，做了一个很轻很轻的梦。",

         story: "在苏州一条安静的巷子里，住着一位叫阿生的木匠。他的生活很简单，每天就是和木头打交道。\n清晨，他被窗外的鸡鸣声唤醒，空气里飘着隔壁家烧饼的香气。白天，他在工作台前，听着刨子划过木料发出的“沙沙”声，看着木屑像雪花一样卷起。阳光透过窗户，照在那些温润的木头上，一切都慢悠悠的。傍晚，他拖着疲惫但满足的身体回家，和家人吃着简单的饭菜，讲讲白天遇到的趣事。睡前，他会想起白天刨木头时，夕阳把木料染成的金色，心里觉得很踏实。\n阿生的生活没有惊心动魄的冒险，却在每一个平凡的日子里，找到了属于自己的幸福和安宁。",

     "2026-04-27": {

      "2026-04-25": {
        story: "今天下了一场小雨，空气里有泥土的味道。\n\n我记得和你说过，最喜欢雨天睡觉。晚安。",
        music: "nightmusic.mp3",

      },
      "2026-04-24": {
        story: "工作有点累，但想到能给你写点什么，就觉得一切都值得。\n\n你要加油，我也是。",
        music: "",  // 这天可以没有音乐
        musicTitle: ""
      },
      // 👇 你可以继续添加更多日期，按相同格式
      // "2026-04-23": {
      //   story: "...",
      //   music: "filename.mp3",
      //   musicTitle: "歌名"

    };

    // =============================================
    // 以下为程序逻辑，无需修改
    // =============================================
    const dateNav = {
      prev: document.getElementById('prevDayBtn'),
      next: document.getElementById('nextDayBtn'),
      display: document.getElementById('currentDateDisplay')
    };
    const contentArea = document.getElementById('contentArea');

    let currentDateStr = ''; // 当前显示的日期 YYYY-MM-DD
    let currentAudio = null; // 当前音频对象

    // 获取所有有内容的日期，按时间排序
    const availableDates = Object.keys(DAILY_CONTENT).sort();

    // 如果没有任何内容，显示提示
    if (availableDates.length === 0) {
      contentArea.innerHTML = `<div class="no-content">✨ 还没有内容，快开始记录吧</div>`;
      dateNav.display.textContent = '---';
    } else {
      // 默认显示最新日期
      currentDateStr = availableDates[availableDates.length - 1];
      renderDate(currentDateStr);
    }

    // 切换日期事件
    dateNav.prev.addEventListener('click', () => {
      const idx = availableDates.indexOf(currentDateStr);
      if (idx > 0) {
        stopCurrentAudio();
        currentDateStr = availableDates[idx - 1];
        renderDate(currentDateStr);
      }
    });
    dateNav.next.addEventListener('click', () => {
      const idx = availableDates.indexOf(currentDateStr);
      if (idx < availableDates.length - 1) {
        stopCurrentAudio();
        currentDateStr = availableDates[idx + 1];
        renderDate(currentDateStr);
      }
    });

    // 停止当前播放
    function stopCurrentAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
    }

    // 渲染指定日期的内容
    function renderDate(dateStr) {
      dateNav.display.textContent = dateStr;
      const data = DAILY_CONTENT[dateStr] || {};
      const story = data.story || '';
      const music = data.music || '';
      const musicTitle = data.musicTitle || '';

      let html = '';
      
      // 故事区
      if (story) {
        html += `<div class="story-card">${escapeHtml(story)}</div>`;
      } else {
        html += `<div class="story-card" style="color:#5c6e88;">（这一天没有故事，只有晚安）</div>`;
      }

      // 音乐区
      if (music) {
        html += `
          <div class="music-card" id="musicCard">
            <div class="music-title">${escapeHtml(musicTitle || '🎵 今日歌曲')}</div>
            <div class="music-controls">
              <button id="playToggleBtn" title="播放/暂停">▶️</button>
              <span class="now-playing" id="nowPlayingLabel">点击播放</span>
            </div>
            <div class="audio-hint">
              <span>若无法播放，请先解锁</span>
              <button class="audio-unlock-btn" id="unlockBtn">🔓 解锁音频</button>
            </div>
          </div>`;
      }

      contentArea.innerHTML = html;

      // 绑定音频事件
      if (music) {
        bindAudioControls(music, musicTitle);
      }
    }

    // 音频控制逻辑
    function bindAudioControls(src, title) {
      const playBtn = document.getElementById('playToggleBtn');
      const nowLabel = document.getElementById('nowPlayingLabel');
      const unlockBtn = document.getElementById('unlockBtn');
      let audio = null;

      // 解锁音频上下文（解决浏览器自动播放限制）
      function unlockAudioContext() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        // 播放一点静音来激活
        const buffer = ctx.createBuffer(1, 1, 22050);
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.start(0);
        nowLabel.textContent = '已解锁，点击播放';
      }

      // 创建或获取音频对象
      function getAudio() {
        if (audio) return audio;
        audio = new Audio(src);
        audio.onended = () => {
          playBtn.textContent = '▶️';
          nowLabel.textContent = '播放完毕';
          stopCurrentAudio();
          audio = null;
        };
        audio.onerror = () => {
          nowLabel.textContent = '音频加载失败，检查文件';
          playBtn.textContent = '▶️';
          stopCurrentAudio();
          audio = null;
        };
        return audio;
      }

      // 播放/暂停
      playBtn.addEventListener('click', async () => {
        const aud = getAudio();
        if (currentAudio && currentAudio !== aud) {
          stopCurrentAudio();
          playBtn.textContent = '▶️';
        }
        if (aud.paused) {
          try {
            await aud.play();
            currentAudio = aud;
            playBtn.textContent = '⏸️';
            nowLabel.textContent = '正在播放...';
          } catch (err) {
            nowLabel.textContent = '播放被阻止，请先解锁';
            playBtn.textContent = '▶️';
          }
        } else {
          aud.pause();
          playBtn.textContent = '▶️';
          nowLabel.textContent = '已暂停';
        }
      });

      // 解锁按钮
      unlockBtn.addEventListener('click', () => {
        unlockAudioContext();
        nowLabel.textContent = '已解锁，点击播放按钮';
      });

      // 页面加载时自动尝试解锁（不强制）
      unlockAudioContext();
    }

    // 简单的转义函数
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  })();
</script>
