<!DOCTYPE html>
<html lang="zh">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes, viewport-fit=cover">
  <title>🌙 深夜小站 · 每日纪念</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background: #0a0f17;
      font-family: system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 8px;
    }

    .app {
      max-width: 500px;
      width: 100%;
      background: #131c29;
      border-radius: 28px;
      overflow: hidden;
      border: 1px solid #2d3d55;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
    }

    /* 头部 */
    .header {
      padding: 22px 18px 12px;
      background: linear-gradient(145deg, #1a2332, #0f1722);
      border-bottom: 1px solid #273546;
    }
    .header h1 {
      font-size: 1.6rem;
      color: #e1ecff;
      font-weight: 400;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .header .subtitle {
      color: #8aa0c0;
      font-size: 0.85rem;
      margin-top: 6px;
      font-style: italic;
    }

    /* 日期导航 */
    .date-nav {
      padding: 16px 12px;
      background: #0e1622;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2d40;
    }
    .date-nav button {
      background: #1e2a3c;
      border: 1px solid #354a65;
      color: #bcd2ff;
      font-size: 1.2rem;
      width: 44px;
      height: 44px;
      border-radius: 44px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: 0.1s;
      -webkit-tap-highlight-color: transparent;
    }
    .date-nav button:active {
      background: #2e4260;
      transform: scale(0.95);
    }
    #currentDateDisplay {
      color: #eef5ff;
      font-size: 1.1rem;
      font-weight: 500;
      background: #1b2537;
      padding: 8px 20px;
      border-radius: 40px;
      border: 1px solid #364e6e;
      text-align: center;
      min-width: 130px;
    }

    /* 内容卡片 */
    .content-area {
      padding: 18px 14px 24px;
      background: #111924;
      min-height: 360px;
    }
    .story-card {
      background: #19222f;
      border-radius: 22px;
      padding: 18px;
      border: 1px solid #2e4058;
      margin-bottom: 16px;
      color: #d7e4fa;
      line-height: 1.6;
      font-size: 0.95rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.3);
      white-space: pre-wrap;
      word-break: break-word;
    }
    .no-content {
      text-align: center;
      color: #6b84a8;
      padding: 40px 10px;
      font-style: italic;
    }

    .music-card {
      background: #15202e;
      border-radius: 22px;
      padding: 16px;
      border: 1px solid #2c4463;
      margin-top: 4px;
    }
    .music-title {
      color: #cadcff;
      font-size: 0.9rem;
      margin-bottom: 10px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .music-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .music-controls button {
      background: #293e5a;
      border: none;
      color: white;
      font-size: 1.2rem;
      width: 46px;
      height: 46px;
      border-radius: 46px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid #4a6c93;
      -webkit-tap-highlight-color: transparent;
    }
    .music-controls button:active {
      background: #3d5b80;
    }
    .now-playing {
      color: #9cb7df;
      font-size: 0.8rem;
      margin-left: 6px;
      flex: 1;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .audio-hint {
      margin-top: 12px;
      font-size: 0.7rem;
      color: #f0b37b;
      text-align: center;
    }
    .audio-unlock-btn {
      background: none;
      border: 1px dashed #f0b37b;
      color: #f5d5b3;
      padding: 5px 16px;
      border-radius: 30px;
      font-size: 0.75rem;
      margin-left: 10px;
      cursor: pointer;
    }

    .footer-note {
      text-align: center;
      color: #405574;
      font-size: 0.7rem;
      padding: 10px;
      border-top: 1px solid #1a2738;
    }
  </style>
</head>
<body>
<div class="app">
  <div class="header">
    <h1>🐭 米老鼠的深夜树洞</h1>
    <div class="subtitle">每天一个故事，一首歌，陪你入睡</div>
  </div>

  <!-- 日期选择器 -->
  <div class="date-nav">
    <button id="prevDayBtn" title="前一天">←</button>
    <span id="currentDateDisplay"></span>
    <button id="nextDayBtn" title="后一天">→</button>
  </div>

  <!-- 内容展示区 -->
  <div class="content-area" id="contentArea">
    <!-- 动态渲染 -->
  </div>

  <div class="footer-note">
    ⏤ 每一天，都为你存在 ⏤
  </div>
</div>

"2026-08-20": {
         story: "窗台外边，一朵小花悄悄开了。\n\n它开得很慢，慢到你能看见它的花瓣一片一片松开，像刚睡醒的小孩在伸懒腰。\n\n夜风从花心里钻出来，带着一点点甜丝丝的香气，轻轻落在你枕边。那不是普通的香，是白天晒过太阳、傍晚喝过露水、又偷偷藏了一小片月光混在一起的味道。\n\n小花把影子投在窗帘上，摇啊摇，像在打拍子。它说今晚我不睡，替你守着窗。你只管闭眼睛，什么都不用管。\n\n于是你把呼吸放慢，闻到那股香气越来越近，像有一只看不见的手，在轻轻拍你的背。\n\n花还开着，开在很深的夜里，等你睡着以后，它才合上花瓣。晚安，我的女孩。",

"2026-08-19": {
         story: "雨下了一天又一天，整个小镇都被泡得软绵绵的。\n\n一只小狐狸被困在树洞里，它把尾巴卷起来当枕头，听着雨敲树叶的声音。洞外雾蒙蒙的，路不见了，家也看不见了。\n\n它有点着急，可雨声太密了，把它的着急也泡软了。它打了个哈欠，看见洞口的积水里浮着一只小纸船。纸船在水面上转着圈，不慌不忙，像在说，回不去就回不去吧。\n\n小狐狸把下巴搁在爪子上，发现雨天的树洞其实很舒服。有青苔的香味，有泥土的呼吸，还有雨滴从叶尖滑下来，滴进小水洼时叮叮咚咚的响。\n\n它闭上眼，觉得整个雨季都在轻轻摇着它。雨还在下，可它已经不怕了。它要睡一会儿，等雨停了，路会自己出现的。\n\n晚安，我的女孩。",

"2026-08-17": {
         story: "闭上眼睛以后，你来到一个只有你能看见的地方。\n\n那里的一切都是用幻想搭起来的。云朵做的小马在草地上慢悠悠地吃草，树上结的不是果子，是一颗一颗会发光的糖。河流里淌着淡淡的牛奶，河底铺着软软的星星沙。\n\n这里没有路标，因为不需要。你想去哪里，路就自己铺到哪里。你想着要一把椅子，风就吹来一把用花瓣编成的摇椅。你想着要一条毯子，月光便从天上垂下来，轻轻盖在你腿上。\n\n纯粹的幻想里，连时间都是软的。你可以把白天没做完的事折成纸船，让它顺着河流漂走。也可以把想念的人变成一阵风，让他从你耳边轻轻经过。\n\n你越来越困了。那些云朵小马挨个趴下来，变成一团一团柔软的枕头。河水的流速慢下来，最后静成一面银色的镜子。\n\n你躺在幻想的正中央，感觉到整个世界都在轻轻往下降，降进一个很深很深的梦里。晚安，我的女孩。",

"2026-08-16": {
         story: "窗外的雨下得不紧不慢，沙沙的，像有人在夜里轻轻翻着一本旧书。\n\n屋里的钢琴声从墙角慢慢升起来，一个音跟着一个音，和雨声交织在一起，分不清哪一滴是雨，哪一颗是琴键落下的光。\n\n你闭上眼睛，好像坐在一间小木屋里。窗玻璃上蒙着一层水雾，外面的树影被雨洗得发亮。钢琴就在你身后，有人正用很轻的力气弹着，音符从指尖滑出来，掉在木地板上，滚到你的脚边，变成一颗颗温热的玻璃珠。\n\n雨声是底色，钢琴是描在上面的线。两样声音彼此让着，谁也不抢。它们一起把房间填满，又给你留出刚好够呼吸的空隙。\n\n你往被子里缩了缩，觉得今晚的夜像被雨和钢琴洗过一样，干干净净的，连梦都还没有落上灰。\n\n雨还在下，琴声还在走。它们会一直陪着你，直到你完全睡着。晚安，我的女孩。",
         music: "20260816.mp3",
         musicTitle: "🌧️淅淅沥沥"

"2026-08-15": {
         story: "浪从很远的地方赶过来，一层一层，不知疲倦，却又不急不躁。\n\n它们拍上沙滩，又慢慢退回去，像大海在做深呼吸。每一次呼吸，都把白天的燥热和嘈杂卷走一点，把月光和盐花的味道推上来一些。\n\n你躺在床上，觉得床好像变成了一艘小船，正在海面上轻轻摇晃。浪声从四面八方涌来，不是闯进耳朵里，是像一双手，从脚底一直按到肩膀，把所有绷紧的地方都揉松了。\n\n沙滩上，一只小寄居蟹背着壳慢慢爬过湿湿的沙地，留下一条很细很细的痕迹。它不赶时间，月亮也不赶时间，海风也不赶时间。整个世界都在用同一种节奏呼吸，慢得刚刚好。\n\n远方的渔火一闪一闪，和海上的星星连成一片，分不清哪一盏在天上，哪一盏在水里。你把眼睛闭上，浪声还在，一声轻，一声更轻，像大海趴在耳边给你数数。\n\n数着数着，你就掉进了那片温柔的水光里。晚安，我的女孩。",

"2026-08-14": {
         story: "今晚的月亮圆得没有一点缺口，像谁在天上挂了一盏磨砂玻璃灯。\n\n它把光调得很柔，一点一点从窗台漫进来，先照亮你的拖鞋，再爬上你的被角，最后停在你的眼皮上，凉丝丝的，像有人用月亮给你敷了敷眼睛。\n\n满月下面，屋顶的瓦片泛着银边，巷子里的石板路亮晶晶的。一只晚归的小狗踩着自己的影子走，影子圆圆的，像跟着它回家的小月亮。\n\n月亮说，今晚我把自己擦得特别亮，是为了给所有还没睡的人留一盏小夜灯。你不用抬头看，我就在窗外守着，把噩梦都挡在云后面。\n\n你翻了个身，月光也跟着你轻轻移动，像一条银色的被子，把你从头到脚盖好。\n\n风把窗帘吹开一点，又合上。月亮往西边挪了挪，用最慢的速度，陪你数着最后的清醒。\n\n晚安，我的女孩",

"2026-08-13": {
         story: "雨下到后半夜，慢慢变轻了。\n\n云朵把最后一点雨收进去，又抖出一些细细的雪粒。它们混在一起落下来，打在窗沿上，声音很小，像有人在用砂糖轻轻撒向玻璃。\n\n路灯照出一小片光，雨丝和雪粒在那片光里跳舞，一个往左，一个往右，偶尔碰在一起，又分开。\n\n它们说好了，今晚不吵醒任何人。雨负责把街道洗干净，雪负责把声音都盖住。\n\n一只小猫从屋檐下探出脑袋，鼻尖接到一粒雪，凉得抖了抖耳朵，又缩回温暖的纸箱里。\n\n你把被子裹紧了些，听见窗外滴滴答答里夹着沙沙声，像世界在为你调试今晚的摇篮曲。\n\n雨会停，雪也会停，但今晚它们都慢慢的，不急着走。\n\n晚安，我的女孩。",

"2026-08-12": {
         story: "今晚，你的床边停着一台很小的时光机。它只有鞋盒那么大，外壳是旧旧的黄铜色，按钮被月光照得发亮。\n\n它没有声音，只是安静地等你。你伸手碰了碰它，它便轻轻震动起来。一个小齿轮咔嗒一声，从机器里吐出一小片光。\n\n那是今天下午三点左右的阳光，正懒懒地躺在你的书桌上，把你没读完的那页书照得发暖。\n\n又吐出一小片，是傍晚的风，带着楼下饭馆飘上来的香味，轻轻拂过你的脸。\n\n时光机慢慢吐着白天那些温柔的小片段，一片接一片，像在放一部很慢的电影。你看着那些光片，眼皮越来越沉。\n\n最后它吐出一片现在的月光，盖在你眼睛上。机器慢慢安静下来，缩回床底。\n\n它哪里都不用去，因为最好的时光，就是此刻你将要入睡的这一小段。\n\n晚安，我的女孩。",

"2026-08-11": {
         story: "雨从傍晚开始下，到了深夜还没有停的意思。\n\n不是那种轰轰烈烈的暴雨，是细细的、密密的，像天空在筛面粉。雨丝落在瓦片上，叮叮咚咚，落在树叶上，沙沙沙沙，落在窗玻璃上，汇成一道道弯弯曲曲的小溪，把窗外的街灯模糊成一团暖黄色的光晕。\n\n整个世界都被雨声填满了。但奇怪的是，这种满不是拥挤的满，是安心的满，像被一条巨大的雨声毯子从头裹到脚。外面的一切都被雨帘隔开了，那些要赶的路、要见的人、要处理的事，全都被雨水冲到了很远的地方。此时此刻，你只需要躺在床上，听雨。\n\n屋檐下有一只躲雨的小蜗牛，它把触角缩回去，又伸出来，缩回去，又伸出来，节奏刚好合上雨滴落下的频率。它说雨不停也挺好的，这样明天就不用赶路了，可以在壳里多待一会儿。\n\n你把被子往肩上拢了拢，脚趾在被子底下蜷了蜷。雨声把你整个人泡得软软的，像一块慢慢化开的水果糖。你听见隔壁房间有人在翻书，纸张摩擦的声音和雨声叠在一起，成了今晚最好听的二重奏。\n\n雨还在下，越下越温柔。它不急着停，你也不急着睡。就让这场雨慢慢地下，慢慢地把你送进梦里。晚安，我的女孩",

         music: "20260809.mp3",

"2026-08-08": {
         story: "夜里有一只巨大的熊，它的毛是深蓝色的，像最深最深的那片夜空。它走起路来一点声音也没有，因为它的脚掌是用云朵做的。\n\n它每晚的工作是收集人们的疲倦。它走过城市，走过村庄，把那些散落在枕头上的焦虑、不安、和白天没说完的话，统统收进背上的布袋里。布袋很大，但一点都不重，因为疲倦是没有重量的。\n\n今晚它走到你窗前，把鼻子贴在玻璃上，呼出的气在玻璃上凝成一小片雾。它看见你还睁着眼睛，便用最轻的声音说，来，把今天的都给我。\n\n你把那些翻来覆去的东西一样一样交给它。它接过去，放进布袋里，用爪子拍了拍，布袋就瘪下去了，像什么都没有装过。\n\n它从另一个口袋里掏出一样东西，放在你手心。是一颗种子，很小，黑黑的，看起来不起眼。它说这是梦的种子，你把它种在枕头里，闭上眼睛，它就会发芽。\n\n你照做了。刚闭上眼，枕头就开始变软，软得像刚出炉的面包。藤蔓从枕头边缘长出来，嫩绿的，一圈一圈把你拢住。叶子展开，花瓣绽开，整个房间都被一种温柔的香气填满。\n\n大熊还在窗外守着。它把布袋垫在地上，自己也趴下来，下巴搁在爪子上，慢慢闭上眼睛。\n\n躲进梦里吧，那里没有需要完成的事，没有需要回答的话。只有一片深蓝色的、正在呼吸的安静。晚安，我的女孩。",
         music: "20260808.mp3",
         musicTitle: "😴让我躲进梦里"
       },
"2026-08-06": {
         story: "一只小精灵在夜空里跑着，脚丫踩过云朵，发出轻轻的噗噗声。\n\n它从月亮那里出发，已经跑了三千里。怀里抱着一小袋星光，跑起来的时候，袋子口没扎紧，星光就一颗一颗漏出来，把身后的云朵染成淡金色。\n\n它说不能停，必须在月亮沉下去之前送到。有人还在等着呢，等着这点光才能安心闭上眼。\n\n它跑过银河，踩醒了正在打盹的星星。星星揉着眼睛问跑这么快干嘛，小精灵已经跑远了，只留下一串发光的脚印。\n\n终于，它在你窗前停下来。翅膀收拢，气喘吁吁地把那袋星光放在你枕边。袋子口松开，星光倾泻而出，铺成一条浅浅的银河，刚好够你的梦在上面漂流。\n\n它说赶上了赶上了，说完就瘫坐在窗台上，用小拳头捶自己的腿。你还没睡着，看见它满头大汗的样子，忍不住弯了弯嘴角。\n\n它说快睡快睡，这袋光是今晚最后一班了。你闭上眼睛，听见它的呼吸慢慢平稳下来，从急促变成均匀，从均匀变成轻轻的鼾声。它在你窗台上睡着了，星光也安静下来。\n\n整条银河都在等你入梦。晚安，我的女孩。",
         music: "20260806.mp3",
         musicTitle: "🏃‍♀️奔跑"
       },
"2026-08-05": {
         story: "夜里的大海很安静，海浪把所有的声音都吞掉了，只留下一条小鲸鱼还在海面上慢慢游着。\n\n它不是普通的鲸鱼，它的背是用云朵做的，喷出的水柱是细细的星光。它已经在海里游了一千年，见过所有船只的灯火，听过所有岸上的故事。但它最喜欢做的事，是找到那些还没睡着的人，然后用最慢的速度游到他们窗前。\n\n今晚它停在你床边。你睁开一点眼睛，看见它巨大的影子温柔地罩住了整个房间。它没有发出任何声音，只是把额头轻轻抵在床沿上。一个浪从很远的地方赶来，在你枕边碎成细小的泡沫，凉凉的，带着深海盐花的味道。\n\n鲸鱼开始唱歌。频率很低，低到人类的耳朵听不见，但你的身体能感觉到。那歌声从脚底升起来，沿着脊椎一节一节往上爬，把每一根紧绷的神经都轻轻松开。你觉得自己正在慢慢沉入海底，但不是溺水，是被海水稳稳地托着，像一片叶子浮在水面上。\n\n鲸鱼说不用怕，海底有光。你低头一看，珊瑚丛里亮起了无数盏小小的灯，那是深海鱼提着灯笼在巡逻。它们排着队从你身边游过，每一条都冲你点点头，像在说欢迎来到这里。\n\n鲸鱼把身体变成一个巨大的摇篮，用尾鳍轻轻拍着海水，拍出一种比心跳还慢的节奏。你躺在鲸鱼的影子里，感觉到一种没有边界的安稳。所有白天的焦虑都浮在水面上，被海浪推得越来越远。\n\n它说这就是无尽幸福，不是什么惊天动地的东西，只是很深很深的安静里，有一条鲸鱼愿意整夜为你唱歌。\n\n天快亮的时候，鲸鱼慢慢沉回海底，把最后一串泡泡吐在你枕边。泡泡破掉的时候，你正做着关于大海的梦。晚安，我的女孩。",
         music: "20260805.mp3",
         musicTitle: "😊无尽幸福"
       },
"2026-08-04": {
         story: "一只小熊站在你家门口，踮着脚，鼻子贴在门缝上。\n\n它已经等了七分钟了。左爪换右爪，右爪又换回左爪，尾巴在身后画了好几个不耐烦的圈。它对着门缝小声嘟囔，还没好吗，还没好吗，星星都出来了，月亮都快爬到正中间了。\n\n你在屋里翻了个身，迷迷糊糊地说马上马上。小熊猫听见你的声音，耳朵竖起来，又耷拉下去。它把脸贴在门板上，凉凉的，很舒服。\n\n它又等了五分钟。这五分钟里它数了楼道里的脚步声，数了窗外过去的车，数了你床头闹钟走动的秒数。数到第三百下的时候它实在忍不住了，用最轻的力气敲了敲门，说喂，你还没好吗。\n\n你终于打开了门。小熊看见你穿着睡衣、头发乱糟糟的样子，忽然就不急了。它把藏在背后的东西拿出来，是一小罐温好的蜂蜜牛奶，盖子拧开，热气弯弯曲曲地飘上来。\n\n它说没什么事，就是来催你睡觉的。你接过牛奶喝了一口，甜得刚好。小熊坐在你床边的地板上，把下巴搁在床沿上，说快睡快睡，我要看着你睡着再走。\n\n你把杯子放下，闭上眼睛。小熊开始打呼噜，比你还先睡着。晚安，我的女孩。",
         music: "20260804.mp3",
         musicTitle: "🫧咕噜咕噜"
       },
"2026-08-03": {
         story: "床头放着一只旧旧的盒子，木头做的，边角磨得发亮。没有人记得它是从什么时候开始在那里的，只知道盒盖一开，齿轮就开始轻轻转动。\n\n今晚你睡不着，伸手摸到那只盒子。盒盖滑开，里面没有发条，没有指针，只有一小片被保存得很好的时光。\n\n那片时光是一个普通的下午。阳光从梧桐叶的缝隙里漏下来，在地上印成明明灭灭的光斑。你走在一条不认识的小路上，前面有人在喊你的名字，声音被风吹散了，你跑起来，跑过一整个夏天。\n\n齿轮又转了一下。这次跳出来的是某个冬夜，窗户上凝着雾气，你在玻璃上画了一个笑脸。指尖凉凉的，但心里很暖，因为背后有人在煮汤，咕嘟咕嘟，香味把整个房间填满了。\n\n盒子里的时光还有很多。它们不是用来让你回到过去的，只是安静地躺在那里，等你偶尔翻看。你看着那些画面，觉得这一路走来，好像也没什么好遗憾的。\n\n齿轮慢下来，盒子轻轻合上。你把头埋进枕头，听见木头盒子在床头柜上发出最后一声嘀嗒，像在说今晚的放映到此结束。\n\n明天醒来，盒子又会自己装满新的时光。晚安，我的女孩。",
         music: "20260803.mp3",
         musicTitle: "⌚️时光机"
       },
"2026-08-02": {
         story: "春天敲了敲你的窗，不是用手指，是用一枝刚开的杏花。\n\n你推开窗，风就进来了。不是冬天那种硬邦邦的风，是软软的、还带着点泥土腥味的风，像一只刚睡醒的小动物在你脸上蹭了蹭。\n\n春天说，我来晚了。路上被一场雨耽误了，雨又变成雪，雪又变回雨，折腾了好久才走到你这里。不过没关系，总算是到了。\n\n它从口袋里往外掏东西。先是掏出一把青草味，撒在空气里。又掏出一串鸟叫，挂在窗框上，那鸟叫断断续续的，像刚学会，还不太熟练。最后它掏出一小片阳光，很薄，薄得能透过去看见你的手指。它把阳光放在你枕头边，说这是留给你的，明天早上用。\n\n你说今晚不需要阳光，因为你要睡了。\n\n春天想了想，把那片阳光翻了个面。背面是月光，柔柔的、软软的，像被牛奶泡过的绸子。它把月光铺在你被子上，又把鸟叫的声音调到最小，让它们变成远远的背景音，像有人在隔壁房间弹一首摇篮曲。\n\n杏花还插在窗缝里，偶尔掉下一片花瓣，落在你枕头上。春天替你掖了掖被角，没有再说话，只是安静地坐在窗台上，守着这个刚被它吻醒的夜晚。\n\n睡吧，春天会在这里坐一整夜。晚安，我的女孩。",
         music: "20260802.mp3",
         musicTitle: "🌸春"
       },
"2026-07-30": {
         story: "一只小猫蹲在窗台上，尾巴尖儿轻轻敲着玻璃，踩着今晚那首欢快的曲子，哒哒哒，哒哒哒。\n\n它不是普通的小猫，它的耳朵尖上各藏着一颗音符，左耳是哆，右耳是咪。它每歪一下头，就有一个音符从耳朵里滚出来，掉在地板上弹两下，又自己爬回它尾巴上排好队。\n\n小猫今晚的任务是陪你。它从窗台上跳下来，在你被子上踩出一串梅花印，每一个印子都亮着微微的光。它踩完左边踩右边，把你的被子踩成了一张软软的钢琴。\n\n它说你不要动，今晚你只需要躺着，听我弹。它开始在被子钢琴上跳来跳去，跳出一首只有你一个人能听见的歌。那首歌不讲什么大道理，只是很单纯地高兴着，像毛线球滚过地板，像小鱼干掉进牛奶碗，像所有不值一提却又闪闪发光的小事。\n\n它跳累了，窝进你胳膊弯里，把脑袋搁在你手腕上。呼噜声从小猫的肚子里升起来，咕噜咕噜，把刚才所有的音符都裹进一团暖烘烘的毛球里。\n\n你闭上眼睛，手指埋在小猫软软的毛里。它翻了个身，露出肚皮，在梦里追着蝴蝶。你的梦也在不远的地方等着，跟它一起跑进很深的夜色里。晚安，我的女孩。",
         music: "20260730.mp3",
         musicTitle: "🐱猫"
       },
"2026-07-29": {
         story: "窗玻璃上凝了一层薄薄的水雾，把外面的世界模糊成一片温柔的光斑。\n\n深夜了，街灯还亮着，透过玻璃折成一道浅浅的虹，落在你的枕边。那道光很轻，轻得像是用糖霜画的线。它在你枕头上来回移动，每走一步就撒下一点点暖意，把你白天所有的疲惫都裹进透明的茧里。\n\n你侧过身，看见玻璃里映着自己的脸。不是白天的样子，是卸掉了所有表情之后，那个最原本的你。你看着自己，觉得自己也变成了一块玻璃。白天里所有的声音、情绪、奔忙，都只是从你身上滑过去的水珠，一粒一粒往下坠，而你始终是透明的，安静的，完整的。\n\n窗外有风摇树枝，影子在玻璃上轻轻晃，像有人在远处朝你挥手。那些还没做完的事、还没消化完的情绪，都被玻璃挡在那一头。它们进不来，只能安静地守着，等你明天再来认领。\n\n你把手指贴在玻璃上，凉凉的。透过指尖，整座城市的灯火都变成了一颗一颗模糊的、正在融化的星星。你不必伸手去够它们，只需要闭上眼睛，让它们自己落进梦里。\n\n玻璃不会碎，它只是把夜晚拢成一只安稳的容器，把你轻轻装进去。晚安，我的女孩。",
         music: "20260729.mp3",
         musicTitle: "🛏️玻璃"
       },
"2026-07-28": {
         story: "清晨的光从窗帘缝里钻进来，轻轻推了推你的肩膀。\n\n你翻了个身，把脸埋进枕头里，嘟囔了一句谁也听不懂的话。光线便不忍心再推你了，只是安静地坐在床沿上，等你自然醒来。\n\n被子把你裹得紧紧的，像一只不肯打开的茧。枕头凹成了刚刚好的形状，刚好容下你所有的懒意。窗外有鸟叫，但叫着叫着自己也觉得太早，声音渐渐低了下去。风把窗帘吹得一鼓一鼓的，像在替你呼吸。\n\n五分钟就够了。五分钟里，梦还可以续上一小段，被窝还是昨夜那个温度，世界还没有开始旋转。那些要交的、要回的、要赶的，都在门外排着队，但门还没开，它们只能等着。\n\n光线在你眼皮上画了一道浅浅的金边，你闭着眼睛，看见那片暖橙色慢慢漾开，像被水稀释的橘子汁。你往被子里又缩了一寸，把最后那点睡意裹紧。\n\n那个声音又在你耳边响起来，轻轻的，带着笑意。它说好吧，就五分钟，五分钟后我再来叫你。你要做一个很甜很短的梦，刚好装得进三百秒。\n\n计时开始。晚安，我的女孩。",
         music: "20260728.mp3",
         musicTitle: "⏰️让我再睡5分钟"
       },
"2026-07-24": {
         story: "夜深了，窗外还有车偶尔驶过，远远的，像大地翻了个身。\n\n有个声音在你耳边说，嘘，轻一点。\n\n于是车轮声轻了，风也轻了，楼下那只总爱叫的小狗把叫声咽回肚子里。月光把脚步放得比羽毛还轻，从窗帘缝里侧着身子挤进来，落在你枕头上，没有一点声响。\n\n你感觉有一双手，不是真的手，是像云一样软的东西，正在轻轻把你的眉头抚平。你今天皱了一整天的眉，那里面积攒的倦意，被一根一根抽出来，放在窗台上晾着。\n\n那双手又去整理了你的呼吸，把它调慢了一点，调匀了一点。你听见自己的心跳声变小了，像有人把它捧在手心里，轻轻摇着。\n\n整个世界都在为你把音量调低。星星闭上了嘴，夜风踮起了脚尖。今晚不需要什么宏大的故事，只需要这样轻轻地，把你送进梦里。\n\n睡吧，已经很轻了。晚安，我的女孩。",
         music: "20260724.mp3",
         musicTitle: "☀️轻轻"
       },
"2026-07-22": {
         story: "小鲸暖，今夜想去哪里旅行呢。\n\n啊，忘了你已经很累了。可是这世界这么美，真的好想把一切都抱在怀里。那就待在这里，等一会儿吧。\n\n我们玩过多少地方了。这片大海，总感觉自己游遍了，却还是有那么多新奇的地方。大海真大啊。\n\n陪我一起感受她的美吧，用我们的所有去感受。刚好，夕阳还没完全沉下。\n\n哎，慢点儿。这夕阳怎么沉得这么快呀，再慢点，我还没看够呢。小鲸暖，你说它怎么就不肯慢下来呢。多么美的景色啊，持续久一些，多好啊。\n\n哦，想想也对。一天里的每个瞬间，都有种独特的美。\n\n那就回去吧，回我们的家。你说夜晚吗，不等了，留给其他人吧。\n\n晚安，我的女孩。",

"2026-07-21": {
         story: "云在夜里游荡，它没有名字，也没有固定的形状。风把它往哪儿推，它就在哪儿停一会儿。今晚它停在你窗前，把月光遮掉了一小半，让房间的光线刚好适合闭上眼睛。\n\n一颗小星星也在游荡，它的轨道不太稳定，总是偏离航向。别的星星都在固定的位置上发光，只有它喜欢到处转悠。它经过北斗，经过猎户，最后趴在你的窗玻璃上，把身体贴成一小块亮晶晶的印记。它说，我不知道我要去哪儿，但今晚我想在这里待一会儿。\n\n一片落叶跟着风游荡了整个秋天，今晚终于落在你的窗台上。它卷着边，身上的颜色已经从金黄变成了焦褐，但它躺得很安心。它说飘了很久，终于找到一个可以安心变碎的地方。\n\n你把被子往肩上拢了拢，觉得自己也是一小片正在游荡的东西。但今晚你有枕头，有软软的床垫，还有一个等着入梦的人。那些还在外面游荡的云、星星和落叶，都在替你继续飘着。你只需要闭上眼睛，让它们在外面值班。\n\n游荡不可怕，因为最后总会有一个地方，让所有漂泊的东西都安静下来。今晚那个地方，就是你的枕头。晚安，我的女孩。",
         music: "20260721.mp3",
         musicTitle: "🚶🏻‍♀️游荡"
       },
"2026-07-20": {
         story: "雨下了一整天，到夜里还没有停的意思。\n\n你坐在床边，没有说话。窗外的路灯把雨丝照成一根一根银色的线，密密地缝着夜空。你看着那些线，觉得自己也是一根针，今天用了太多次，有点钝了。\n\n有人端着一杯温水走过来，放在你手边。杯子底碰到木桌面的那一声很轻，轻得刚好填进你沉默的缝隙里。那个人什么都没问，只是在你旁边坐下来，拿起一本翻了一半的书，安安静静地看。\n\n你忽然觉得这个夜晚变软了一点。不是因为雨小了，是因为身边坐了一个不需要你开口的人。你的安静没有被当成需要修理的东西，它只是被放在那里，被一双温柔的手轻轻托着。\n\n有些话不说也没关系。窗外的雨替你说完了，杯子里冒出的热气替你表达了。你不必总是阳光灿烂，你的沉默也值得被好好对待。\n\n那个人翻了一页书，往你这边靠了靠。你闭上眼睛，把今天所有没说出口的话都暂时存进枕头里。雨还在下，但你心里有一小块地方，悄悄晴了。\n\n晚安，我的女孩。",
         music: "20260720.mp3",
         musicTitle: "🤫如果某天有人读懂我的安静"
       },
"2026-07-18": {
         story: "你是我心里的归宿\n\n我不知道没你我怎么办\n\n再讲一万遍我也永远喜欢我爱的人\n\n你出现胜过明媚的春\n\n遇见你我是幸运的因为你总让我笑\n\n有你是雨季里的小伞撑起一片晴天\n\n所以呀\n\n世界请你好好把幸福给我的彤宝\n\n故事的开始是我们出现在同一个教室\n\n你做我的向日葵我做你的小太阳\n\n永远这词我只相信你\n\n你才是我最后的底牌",
         music: "20260718.mp3",
         musicTitle: "✅允许"
       },
"2026-07-17": {
         story: "她说今晚的月光很好，你要不要出去走走。\n\n你迷迷糊糊睁开眼，看见一个女孩坐在窗台上。她穿着白色的裙子，光着脚，手里拿着一朵刚摘的栀子花。你不认识她，却觉得她很熟悉，像某首很久以前听过的歌。\n\n她跳下窗台，在你枕头边放了两颗薄荷糖。糖纸是透明的，里面的糖正在慢慢融化，淌成一汪小小的、绿色的湖。她说困了就睡吧，我只是来看看你。\n\n你想问她的名字，可是嘴巴张不开了。她把那朵栀子花放在你鼻尖，香味软软的，像有人用花瓣给你盖了一条毯子。\n\n后来她走了。没有说再见，只是把窗子轻轻合上，把月光叠好放在你枕边。窗台上留下两片湿湿的脚印，和一颗没化完的薄荷糖。\n\n你翻了个身，听见远处有钢琴声传来，大概是她在别的窗台上，继续给下一个失眠的人送花。\n\n有些人只是来看看你，不需要告别。晚安，我的女孩。",
         music: "20260717.mp3",
         musicTitle: "☀️我在"
       },
"2026-07-16": {
         story: "林逾唱过一首歌，名字叫小树。\n\n今晚那首歌从耳机里长出来，在你枕头边扎了根。音符变成了细细的根须，钻进棉花里，又冒出一截嫩绿的芽。芽伸了个懒腰，展开一片叶子，两片叶子，然后是更多。它们轻轻地摇，像被看不见的风推着，推出一种很慢很慢的节奏。\n\n小树不长高，它只往温柔的方向伸展。枝桠垂下来，刚好碰到你额头，凉凉的，带着雨后森林的气味。有一根枝条把月光卷起来，做成一个软软的茧，刚好够你窝进去。\n\n林逾的声音在树冠里穿行，像晚归的鸟在找自己的枝头。歌词落下来，一片一片铺在你身上，每一句都轻得像叶子落在水面上。\n\n你闭上眼睛，小树就把所有的叶子都翻到背面，把夜晚的光全挡在外面，只留它自己淡淡的绿。树根在地下轻轻呼吸，和你的呼吸慢慢变成同一个节奏。\n\n明天太阳升起来的时候，小树会缩回耳机里去。但今晚，它守着你，一叶一叶地数着你的梦。晚安，我的女孩。",
         music: "20260716.mp3",
         musicTitle: "🌲小树"
       },
"2026-07-14": {
         story: "银河快递的列车停在你的窗前，没有声音，只是安静地亮着灯。\n\n车窗里透出暖黄色的光，像深夜便利店里最后一排货架，专门留给晚归的人。车门开了一条缝，没有人催你上车，只有一个很轻的声音问，需要人陪吗。\n\n你点点头，它便在你床边坐下来。它不长什么样子，更像一团被月光填满的轮廓，软软的，不占地方。它不问你今天过得怎么样，不催你快点睡着，只是安安静静地待着，像一只收起了指针的钟。\n\n你说其实也没什么大事，就是今晚有点空。它说我知道，我就是来填那个空的。\n\n窗外有车灯偶尔扫过天花板，又消失。它的光也跟着明灭了一下，像在呼吸。你把被子往上拉了拉，它往你旁边又挪了一点点，刚好够你的手碰到一片暖。\n\n银河还在窗外远远地流着，但今晚你不用去任何地方。有人陪着，失眠也没那么长了。\n\n晚安，我的女孩。",
         music: "20260714.mp3",
         musicTitle: "🤗需要人陪"
       },
"2026-07-04": {
         story: "今天去了你家。\n\n在前往你家的那几分钟，我把二十多年的勇气都攥在了手心里。开门的时候，我听见自己心跳的声音，比解锁声还响。\n\n后来门开了，跟着你坐下，看着你。所有的紧张突然就有了着落。\n\n被一个人带回家，是一件很郑重的事。意味着你愿意让我看见你曾经成长过的地方，愿意让我走进你的来处。我坐在你家饭桌上，忽然觉得自己被认真对待了。\n\n这世界上有很多种认可，被你家人所认可，是最踏实的那一种。\n\n回家的路上我一直在想，今天之后，我们好像又近了一步。不是轰轰烈烈的近，是那种很确定的、很安稳的近。像树扎了根，像月亮找到了自己的轨道。\n\n今天是很重要的一天。不是因为做了什么，是因为你愿意。\n\n晚安，我的女孩。",
         music: "20260704.mp3",
         musicTitle: "☀️慢慢发光l"
       },
"2026-07-01": {
         story: "深夜的钟楼敲了第十二下，整座城市都睡着了，只有你床头的闹钟还在滴滴答答地走。\n\n忽然，时针往回拨了一格，声音很轻，像有人踮着脚尖走过木地板。\n\n你发现自己站在一条长长的走廊里，两边挂满了门。门上的标牌不是数字，是年份和日期。有一扇门虚掩着，你轻轻推开，看见里面是某个夏夜的海边，浪花正把月光推上岸。另一扇门后面是初雪天的街角，路灯下站着穿红围巾的人，正仰头看雪花往下落。\n\n有个声音在你耳边说，这些都是你存下的时光，想再看一眼吗。\n\n你摇摇头，说我有点困了，只想好好睡觉。\n\n那个声音笑起来，把一扇写着今天的门轻轻合上。走廊的灯一盏一盏暗下来，闹钟的滴答声越来越远，像被什么东西温柔地盖住了。\n\n你觉得自己变成了一颗正在下落的雨滴，穿过所有关闭的门，稳稳地落在今晚的枕头上。过去的时间在门外安静地守着，明天的时间还在远处等着，而此刻，你只需要好好睡着。\n\n钟楼的齿轮慢了下来，把所有指针都拨向凌晨。晚安，我的女孩。",
         music: "20260701.mp3",
         musicTitle: "⌚️Time Travel"
       },
"2026-06-29": {
         story: "停车场的灯光是橙黄色的，一盏一盏，把空旷的水泥地照得暖洋洋的。\n\n这是城市入睡前最后的安静角落。白天拥挤的车位现在都空着，地面上的白线一根一根躺得笔直，像刚刷完牙准备睡觉的小孩。只有一辆晚归的车缓缓倒进车位，尾灯在夜色里画了两道温柔的红色弧线，然后熄灭。\n\n车门打开，走出来的人伸了个懒腰，把一天的奔波锁在车里。钥匙扣上的小铃铛叮了一声，被空旷的停车场放大了好几倍，传到很远的地方才慢慢消散。\n\n电梯间的按钮亮着橘色的光，像一颗还没睡的星星。你靠着电梯壁，听见缆绳缓缓拉动的声音，嗡嗡的，低沉又规律，像这座城市的摇篮曲。数字一格一格往上跳，把夜晚也一格一格拉长。\n\n到家了。钥匙转动门锁的那一刻，停车场在你身后轻轻打了个哈欠。它也要休息了，那些橙黄色的灯正在一盏一盏调暗，像闭上了无数只眼睛。\n\n你躺下来，耳边还残留着停车场的安静。那种安静不是空无一物，而是被深夜仔细打扫过的、干干净净的安静。晚安，我的女孩。",
         music: "20260629.mp3",
         musicTitle: "🅿️Car Park"
       },
"2026-06-28": {
         story: "夏夜的风敲了敲你的窗，不是用指节，是用一片刚掉下来的梧桐叶。\n\n你推开窗，一股热烘烘的青草味扑进来。远处的蝉还没有下班，在树荫深处拖长了声音叫着，像是在呼唤晚归的云。池塘里的青蛙接上了，这边的刚停，那边的又起，它们在排练一首唱了整个夏天的合唱。\n\n有一个小小的声音混在蝉鸣和蛙声中间，特别轻，像用蒲公英的绒毛做的。它说，出来玩吧，夏天还没有结束呢。\n\n你顺着声音走出去，赤脚踩在还留着白天余温的石板路上。路边的草丛里，萤火虫已经点起了灯笼。一只蜻蜓停在你肩膀上，翅膀薄薄的，把月光筛成细碎的银色。\n\n那个声音又响了，说看这边。你转过头，看见银河正从东山头慢慢升起来，星星一颗接一颗亮过去，像谁在天上按下了串灯的开关。\n\n夜风把茉莉花的香气送过来，也把那个呼唤声送到你耳边。它说，困了吗，困了就回去吧。\n\n你回到床上，窗还开着。蝉鸣和蛙声还在，但它们现在不是呼唤了，变成了摇篮曲。风把窗帘吹得一鼓一鼓的，像夏天的肺在均匀地呼吸。\n\n那个声音最后说，明天见。然后悄悄把窗掩上。晚安，我的女孩。",
         music: "20260628.mp3",
         musicTitle: "☀️夏日的呼唤"
       },
"2026-06-25": {
         story: "闹钟响了两遍你才从被窝里爬起来，阳光已经铺了半个房间。\n\n周末的校园安静得像被泡在蜂蜜水里面，连风都走得很慢。你背着书包走在空荡荡的走廊里，心里有一点不情愿。补课这件事，总是让人想在路过球场的时候多磨蹭两圈。\n\n楼梯拐角的光特别好，好得有点过分。梧桐树的影子从窗户漏进来，一格一格印在台阶上。你低头踩影子玩，踩到最后一个台阶的时候，听见有人叫你的名字。\n\n抬头的时候，那个人就站在走廊那头。白色的衬衫被风吹起来一点点，手里抱着几本书，逆着光，轮廓毛茸茸的，像被太阳镀了一层金边。他朝你笑了一下，说你怎么也来啦。\n\n你说来补课。他说他也是。然后你们并肩走完了剩下的走廊，阳光一直跟在身后，把两个人的影子叠在一起。\n\n原本有点闷的教室忽然变得很亮，电风扇吱呀吱呀转着，把下午的阳光搅成一杯淡金色的汽水。你坐在座位上，翻开书，嘴角还挂着刚才没来得及收回去的笑。\n\n今晚躺下的时候，这个画面又来拜访你了。阳光还在，走廊还在，那个人还站在光里，朝你笑了一下。你闭上眼睛，把这一幕当成了今晚梦境的第一帧。晚安，我的女孩。",
         music: "20260625.mp3",
         musicTitle: "☀️偶遇"
       },
"2026-06-22": {
         story: "桌上的冰美式已经见了底，杯壁上凝出一圈细细的水珠，正一颗一颗往下滑。\n\n冰块在玻璃杯里轻轻碰了一下，发出这个夜晚唯一的一声脆响。咖啡的苦味早就散尽了，杯底只剩一汪被水稀释过的淡棕色，像傍晚被雨水洗过的马路。\n\n你把空杯子推到一边，趴在桌上。困意像一颗慢慢融化在深夜里的方糖，从脚尖开始往上漫。\n\n窗外的便利店还亮着光，白炽灯嗡嗡地响，把一小块路面照得发亮。自动门开了一下，又合上，没有人进出，大概是风。\n\n你闭上眼睛，听见冰箱压缩机低沉的震动声从厨房传过来，像这座城市夜晚的心跳。冰美式的最后一点凉意还留在舌尖，清清爽爽的，把夏天黏糊糊的热气全赶走了。\n\n杯子里的冰块又融化了一小块，咔嚓，像城市翻了个身。你也翻了个身，把脸埋进臂弯里。\n\n今晚的梦大概是冰镇过的，不会太甜，但很解渴。晚安，我的女孩。",
         music: "20260622.mp3",
         musicTitle: "☕️冰美式"
       },
"2026-06-21": {
         story: "深夜的花园里，最后一只蝴蝶收拢了翅膀，停在你窗台的茉莉花上。\n\n它把今天收集到的所有颜色都摊开来，有早晨露水的透明，午后阳光的金黄，还有傍晚天空褪下的那一层淡紫。它用翅膀尖蘸着这些颜色，在空气里画圈。一圈，一圈，越画越慢，越画越轻。\n\n后来它画累了，就把剩下的颜色全抖落在你枕头边。那些颜色变成细细的粉末，飘起来，落在你眼皮上。你的眼皮变得有一点点沉，又有一点点暖。\n\n蝴蝶飞进来，在你额头上轻轻扇了一下翅膀。那阵风太小了，小得只够吹走今天留在你眉间的那一点点皱。\n\n它说外面的花都睡了，树也睡了，月亮也盖好了云做的被子。现在该你了。\n\n你把脸往枕头里埋了埋，呼吸慢慢变得很长。蝴蝶关掉了花园里最后一盏小灯，把自己也收进茉莉花的花心里。晚安，我的女孩。",
         music: "20260621.mp3",
         musicTitle: "🦋蝴蝶"
       },
"2026-06-16": {
         story: "夏夜深处，有一片只有迷路的人才能找到的森林。\n\n今晚你推开窗户的时候，不小心踩进了一片软软的青苔。抬头一看，城市的灯火全不见了，头顶是密密的树冠，树叶间漏下来的不是月光，是无数颗明明灭灭的萤火。\n\n那些萤火虫提着灯笼在树与树之间游荡，飞得很慢，像是在找什么东西。你跟着它们往前走，脚下的苔藓吸走了你所有的脚步声，整个世界只剩下萤火翅膀扇动时那种轻微的、像绸缎摩擦的声音。\n\n它们把你领到森林中央的一棵老树下。树根盘成一个天然的摇篮，里面铺着一层厚厚的、还沾着露水的花瓣。一只最大的萤火虫飞到你面前，把灯笼调暗了一点，在空中画了一个圈，像是请君入梦的手势。\n\n你躺进去，树根轻轻晃起来。成千上万只萤火虫聚拢过来，在你头顶织成一张缓缓闪烁的网。它们的光一明一灭，刚好合上了你呼吸的节奏。\n\n森林里有溪水在远处流淌，淙淙的，和萤火虫振翅的声音混在一起，变成了夏天最轻的摇篮曲。你闭上眼睛，觉得自己也变成了一颗小小的光，被整片森林温柔地捧在手心里。晚安，我的女孩。",
         music: "20260616.mp3",
         musicTitle: "🔥萤火之森"
       },
"2026-06-10": {
         story: "草坡上的野花不知道什么时候全开了，白的紫的黄的，像谁不小心打翻了春天的颜料盘。\n\n一只棕色的小熊推着独轮车从山坡那边慢慢走上来，车里装的不是蜂蜜，是一整车的阳光。它把阳光卸在草地上，一堆一堆的，等着分给还没醒的种子。\n\n你坐在草坡顶上，风从山脚一路跑上来，带着桃花的味道，还有新翻的泥土里冒出来的湿湿润润的香。小熊看见了你，朝你挥了挥爪子，又继续低头忙它的。\n\n它在每颗种子旁边放一小撮阳光，再用爪子轻轻拍实。有一只路过的小蝴蝶停在它鼻尖上，它打了个喷嚏，把蝴蝶吓了一跳，飞得老远。\n\n你笑了，笑完觉得更困了。草坡软软的，像一块巨大的绿绒毯，你往后一躺，整个天空都铺在眼前。云走得很慢，比时针还慢。\n\n小熊忙完了，在你旁边坐下来，从口袋里掏出一小罐蜂蜜，用爪子蘸了一点抹在你手背上。它说春天的味道是甜的，你闻到了吗。\n\n你闻到了，甜甜的，暖暖的，像梦的引子。晚安，我的女孩。",
         music: "20260610.mp3",
         musicTitle: "☀️春日"
       },
"2026-06-09": {
         story: "傍晚的光从窗户斜斜地照进来，在地板上画了一块暖暖的平行四边形。\n\n屋子里很安静，只有墙上那口老钟在慢慢走。沙发上搭着一条叠好的毯子，茶几上的杯子还冒着最后一丝热气。厨房里炖着汤，咕嘟咕嘟，是那种听久了就会打哈欠的声音。\n\n你推开门的瞬间，所有东西都刚刚好地待在该在的地方。拖鞋摆在脚边，靠垫拍得松松软软，今天的疲倦被自动归到门口的篮子里。\n\n有个人从厨房探出头，围裙上还沾着一点面粉，冲你笑了笑，说回来啦，汤马上就好。那个声音像被太阳晒过的棉被，裹在身上，每一根神经都松了下来。\n\n你窝进沙发里，把脸埋进靠垫。窗外的天从橘红变成浅灰，又从浅灰变成深蓝。星星一颗一颗亮起来，像是在窗外排队，等着看你睡着。\n\n汤端到茶几上的时候，你已经迷迷糊糊了。那个人把毯子给你盖好，又把灯光调到最暗。屋子里所有的东西都静下来，陪着你一起慢慢沉进梦里。\n\n爱住的地方，就是家。晚安，我的女孩。",
         music: "20260609.mp3",
         musicTitle: "❤️Love home"
       },
"2026-06-08": {
         story: "河湾边的柳树垂着长长的枝条，叶子尖儿刚好碰到水面，画出一圈一圈细细的涟漪。\n\n一个围着旧围裙的女人站在花园里，正弯腰摘着矮枝上的浆果。她的手指很轻，像是怕惊醒了还睡在花瓣上的露水。夕阳把她的影子拉得很长，一直铺到你的脚边。\n\n她抬起头，冲你招了招手，说过来吧，这里的果子已经熟了。她的声音像被溪水洗过，清清凉凉的，带着一点青草和泥土的味道。\n\n你走进去，赤脚踩在软软的草地上。她递给你一颗浆果，又转身去侍弄那排铃兰。风从河湾那边吹过来，把她的裙角吹得轻轻晃，也把你的眼皮吹得越来越重。\n\n她说累了就躺下吧，草地很软，柳树会替你遮着光。你枕着双手躺下来，看见天空从淡紫变成深蓝，星星一颗一颗浮出来。\n\n她还在不远处哼着一首听不清词的歌，调子跟河水一样缓慢，转了几个弯，流进你的梦里去了。晚安，我的女孩。",
         music: "20260608.mp3",
         musicTitle: "🌹Down by the Sally Gardens"
       },
"2026-06-06": {
         story: "窗外的梧桐叶轻轻翻了个身，把月光抖了一地。\n\n夏夜很深，深得像一口装满了星星的古井。晚风从纱窗的缝隙里钻进来，带着茉莉花的香气，还有远处池塘里蛙鸣的余音。一只纺织娘不知躲在哪个墙角，正吱吱地摇着它的小纺车，纺出一匹看不见的凉意。\n\n你躺在凉席上，听见邻居家的风铃偶尔响一下，叮的一声，又被夜收走了。院子里那棵老槐树把影子投在你的窗帘上，像一幅会呼吸的水墨画。树叶沙沙地响，像是在说，睡吧，我帮你守着这个夜晚。\n\n月亮爬到你窗前，放下了一整片银色的纱。它轻手轻脚的，怕吵醒那只趴在墙根下打盹的蛐蛐，也怕打扰你刚涌上来的睡意。\n\n风又软了一些，把远处稻田里的蛙声调低了好几度。那些原本热闹的歌唱，现在听上去像一首从大地深处传来的摇篮曲。泥土把白天的暑气都吐干净了，只剩一股清清润润的味道，裹着你往梦里沉。\n\n夏夜还有很长，星星还有很多颗要数。它们不急，你也别急。晚安，我的女孩。",
         music: "20260606.mp3",
         musicTitle: "🌙夏夜"
       },
"2026-06-05": {
         story: "灯塔的光转了一圈，又转了一圈，在海面上画着永远不会停的圆。\n\n那束光从很远的地方来，穿过咸咸的海风，穿过薄薄的雾，稳稳地落在你枕头边。它不刺眼，暖融融的，像有人用手掌拢住了灯芯，只漏给你最温柔的那一小片亮。\n\n你闭着眼睛问，这盏灯会亮多久。\n\n海风替它回答，永远。不是轰轰烈烈的永远，是每晚都来的永远，是你需要光的时候它就在的永远。浪花在礁石上碎成细细的泡沫，一遍一遍重复着同样的话，永远，永远。\n\n灯塔里住着一个白发的老爷爷，他往灯里添的不是油，是今天傍晚新摘的星星粉末。他推了推老花镜，朝你的方向看了一眼，说这孩子还没睡呢，我再多亮一会儿。\n\n于是光又暖了一些，把整个房间拢进一个金色的茧里。你在茧里翻了个身，呼吸慢慢变长，嘴角还挂着一丁点笑。\n\n灯塔整夜亮着，海浪整夜念着同一句咒语。永远有多远，就是从灯塔到你枕边，再从今晚到每一个晚上。晚安，我的女孩。",
         music: "20260605.mp3",
         musicTitle: "🤗永远常在"
       },
   "2026-06-04": {
         story: "老房子里的灯还亮着，暖黄暖黄的，像一颗煮熟的蛋黄挂在窗边。\n\n炊烟从屋顶升起来，在暮色里画了一道软软的弧线。风把厨房的味道送到很远的地方，有刚煮好的米饭香气，有菜汤咕嘟咕嘟冒泡的声音，还有烤肉上那层焦焦的酱油香。门口的柿子熟了，沉甸甸地垂在枝头，一只狸花猫在树下蜷成一团，尾巴盖住鼻子，睡得正香。\n\n一个围着围裙的身影站在灶台前，手里的木勺轻轻搅着锅里的汤。她回过头，冲你笑了笑，皱纹里全是温柔。她没有说话，只是把一碗热汤推到桌上，又把拖鞋摆正，等着你换下鞋子进屋。\n\n你坐下来，把今天的疲惫都卸在门口的台阶上。汤有点烫，你吹了一口，热气蒙在脸上，整个夜晚都变得毛茸茸的。\n\n窗外有人在哼着调子，大概是邻居家的小孩，声音越来越远，最后被晚风收走了。狸花猫翻了个身，继续做它的梦。\n\n你喝完了汤，趴在桌上就睡着了。梦里有人给你披了一件旧旧的外套，那味道，跟小时候一模一样。晚安，我的女孩。",
         music: "20260604.mp3",
         musicTitle: "😌故乡的味道"
       },
"2026-06-03": {
         story: "夜已经深得很安静了，可你的耳边忽然传来一阵很轻很轻的声音。\n\n不是窗外的风声，是墨尔本的大街上，最后一班电车叮叮当当地驶过街角。车轮碾过铁轨，溅起一小朵水花，那是傍晚刚下过的雨。街边的路灯把光晕洒在湿漉漉的石板路上，整条街都亮晶晶的，像铺满了碎月亮。\n\n你发现自己正坐在电车的最后一排，车窗开了一条缝，风把深秋的梧桐叶送进来，落在你旁边的座位上。电车上只有你一个人，司机哼着一首很老的歌，调子慢悠悠的，跟车速一样慢。\n\n你靠在车窗上，看着街景一点一点往后退。那家关了一半的咖啡店还亮着暖黄的灯，老板正把椅子倒扣在桌上。街角的书店橱窗里，一本摊开的书被风吹翻了一页。\n\n电车开得很慢，好像不着急到达任何地方。你闭上眼睛，车轮和铁轨的节奏变成了摇篮曲，叮当，叮当，每一声都比上一声更远。\n\n墨尔本的大街在夜里打了个哈欠，把灯火一盏一盏收进怀里。你也在电车上，被轻轻送到了梦的下一站。晚安，我的女孩。",
         music: "20260603.mp3",
         musicTitle: "💃在墨尔本的大街上"
       },
"2026-06-02": {
         story: "山已经很老了，老得记不清自己在这里站了多少年。今晚的雨是从山背后绕过来的，细细的，软软的，像有人在半山腰用最轻的力气弹着琴键。\n\n雨打在树叶上，树叶点点头。雨落在石头缝里，溅起一朵一朵小小的水花。山里的小动物们都回了窝，只有一只还没睡的小松鼠，竖着耳朵蹲在树洞口，听雨一滴一滴数着松针。\n\n山把所有的雨声都收进怀里，高的低的，远的近的，拢成一曲安安静静的调子。它弯下腰，把这个调子送到你枕边。\n\n你闭上眼睛，觉得自己也变成了一座小小的山。雨落在你的头发上，落在你的肩膀上，把今天的疲惫一点一点洗掉。山在你耳边说，睡吧，雨还要下一整晚，够你做一个青翠的梦。\n\n你往被子里缩了缩，听见窗外最后几滴雨轻轻敲着栏杆。山没有睡，它守着这片雨，也守着你。晚安，我的女孩。",
         music: "20260602.mp3",
         musicTitle: "🌧️山听雨"
       },
"2026-06-01": {
         story: "窗台边那盆小绿植，今晚悄悄伸了个懒腰。\n\n藤蔓沿着月光往上爬，爬过窗框，爬过书桌的边角，在你枕头旁边悄悄探出一片新叶子。叶片嫩绿嫩绿的，还卷着边儿，像刚睡醒的小孩还没来得及睁眼。\n\n一滴露水从叶尖滑下来，落在你的手背上，凉凉的。你迷迷糊糊睁开一点眼睛，看见满屋子都是绿意，藤蔓织成了软软的帘子，叶子铺成了厚厚的地毯。空气里有雨后泥土的味道，还有一点点薄荷的清凉。\n\n那盆小绿植把最嫩的叶子盖在你眼睛上，替你挡掉今晚所有的亮光。它说，森林里的朋友都睡着了，你也该睡啦。\n\n你闭上眼睛，听见很远的地方有小溪流过石头的声响，叮叮咚咚，像给今夜配了一首摇篮曲。\n\n满屋子的绿意安静地守着，等你入梦。晚安，我的女孩。",
         music: "20260601.mp3",
         musicTitle: "🌿绿意盎然"
       },
"2026-05-31": {
         story: "夜里很静，钢琴声从墙角那盏小灯下面流出来，像一条发着光的小溪。\n\n有一个小小的声音，开始说起关于你的一切。\n\n说起你笑的时候，眼睛会弯成什么样的弧度。说起你走路的时候，发梢怎样跟着步子轻轻晃。说起你睡着的时候，呼吸会变得很长很长，像月亮在海面上铺开的光。\n\n那个声音很轻，像有人在翻一本只有你名字的书。每一页都写满了字，可翻起来却薄薄的，像羽毛落在水面上。\n\n它说，这些都是关于你的事，大的小的，重要的不重要的，全都收在这里了。你不需要记住它们，你只需要安心地睡。\n\n钢琴还在弹，那个声音慢慢变成了哼唱，哼的是你最喜欢的调子。你把被子往上拉了拉，嘴角弯了一点。\n\n今晚所有的音符，都是关于你的。晚安，我的女孩。",
         music: "20260531.mp3",
         musicTitle: "🌙All about Anna"
       },
"2026-05-30": {
         story: "山上的风在傍晚慢了下来，路灯一盏接一盏亮起来，像在等什么人。\n\n她站在云想山的入口，被风撩起的头发让她看起来像是从星光里走出来的。我们带着车出发，路极卡丁车载着两个人的笑声在山道里转弯，轮胎摩擦地面的声音很好听，像心跳踩在节拍上。\n\n下山后路过一排娃娃机，暖黄色的灯光把一整排玻璃柜照得透亮。我们停下来，第一只娃娃被我抓起来的时候，她轻轻哇了一声。第二只小可爱也乖乖落进洞里。轮到她自己来，她屏着呼吸，像对待一个很认真的仪式。爪子在玻璃柜里挪动、下落，抓起来，稳稳地送到出口。她抓起那只娃娃举到我面前，笑得像赢了整个世界。\n\n今天开始我们的上班搭子多了两个，一个小粉一个小黑。\n\n那款叫双人成行的游戏，我们只玩了一个开头。屏幕上的两个小人刚踏上旅途，还不知道后面会有多少关卡。没关系，我们也才刚刚开始。\n\n后来我站在她面前，把那些攒了很久的话一句一句说给她听。山顶的风没把它们吹散，她听到了，她说好。\n\n回家的路上月光铺了一地，我忽然想起忘了给这一天写一个结尾。不过没关系，这一天不需要结尾，它只是我们故事的第一页。",
         music: "20260530.mp3",
         musicTitle: "📚A Little Story"
       },
"2026-05-29": {
         story: "钢琴声从很远的地方飘来，像一阵风翻过山谷，又轻轻落在你的窗前。\n\n你闭上眼睛，看见一条长长的小路，路两边开满了不认识的花。路的尽头有一棵大树，树下坐着一个老人，他正在织一件毛衣，毛线是月光纺的，针脚细细密密，每一针都踩着琴键的节拍。\n\n你问他，在等什么。\n\n他说，在等那个时刻到来。毛衣快织好了，到时候会有人穿上它，走很远很远的路也不会冷。\n\n你在树根上坐下来，看他织毛衣。一针上一针下，像潮水呼吸。月光毛线从他手里流过去，又流到你的眼皮上，凉凉的，软软的。\n\n他说，孩子，不用等了，你已经很累了。那棵大树弯下腰，把你拢进树荫里。\n\n织毛衣的声音还在，只是越来越轻，像雨停了，叶子还在滴水。",
         music: "20260529.mp3",
         musicTitle: "⌚️直到那个时刻到来为止"
       },
"2026-05-28": {
         story: "夜深了，月亮缺了一小块，像被谁轻轻咬过的糯米糍。\n\n你听见有人在哭，声音细细的，从云层上面传下来。你抬头一看，原来是月亮。\n\n它说，今晚有点难过，云朵太厚了，它的光照不到想照的那个人。\n\n你说没关系的，光已经很好了，你看见了的。你把窗帘拉大一点，让月亮的光刚好落在枕头边。你还放了一点今晚的钢琴声上去，让它顺着光爬回月亮那里。\n\n月亮不哭了。它把那些眼泪变成了满天的小星星，一颗一颗，亮晶晶地挂在夜空里。\n\n它说谢谢你，这些星星都是给你的。\n\n你闭上眼睛，钢琴还在弹，月光铺了一床。那些新出生的小星星守在你窗外，眨了一整夜的眼。",
         music: "20260528.mp3",
         musicTitle: "🌙Cry for the moon"
       },
"2026-05-27": {
         story: "窗外的远山沉默了一整天，墨色的轮廓在夜色里变得模糊，像一个安静的巨人，屏住了呼吸。\n\n你听见远方的海浪声，一叠一叠，不知疲倦地朝岸边赶来。那声音穿过千万里，却在你枕边放慢了脚步，变得比呼吸还轻。\n\n古人说山海不可平，可今晚的山只是沉默地守着夜，海只是温柔地数着沙。它们没想过要平，它们只是想陪你一会儿。\n\n你把脸埋进枕头，感觉自己变成了一座小小的岛。山在左边，海在右边，而你在中间，被它们安安静静地守护着。岛上的小花收了花瓣，小树也垂下了叶子。\n\n海浪递过来最后一朵白浪花，放在你的脚边，凉凉的，像一句只说给你听的晚安。山没有开口，只是把影子拉长了一点，刚好盖住你的梦。\n\n今晚的山海，都只为你值班。",
         music: "20260527.mp3",
         musicTitle: "⛰️山海可不平"
       },
"2026-05-26": {
         story: "夜深了，时钟的指针马上就要碰到十二点。你闭上眼睛，听见有什么东西在轻轻响动。\n\n不是秒针，不是风声，是时间本身翻页的声音。\n\n你发现自己站在一个安安静静的小站台上，身后是已经过去的今天，面前是一列刚停稳的列车。车门打开，里面没有人，只有一排空空的座位，和窗外即将开始的明天。\n\n你挑了一个靠窗的位置坐下来。列车缓缓启动，窗外的风景从黄昏变成星光，又从星光变成浅浅的鱼肚白。\n\n这一分钟，是专门留给开始的。不用着急想明天要做什么，也不用回头看今天还有什么没做完。你只需要坐在这里，让列车带着你，穿过这一分钟的隧道。\n\n钢琴声在车厢里轻轻回响，像有人在耳边说，准备好了吗，要开始新的梦了。\n\n你点点头，把脸靠在车窗上。列车驶出隧道的那一刻，你已经睡着了。",
         music: "20260526.mp3",
         musicTitle: "🌙A Minute for the Beginning"
       },
"2026-05-25": {
         story: "夜很深了，你的脑海里却还在放电影。那些白天的声音、细碎的烦恼，像不肯退场的观众，在脑袋里一遍遍安可。\n\n你把被子拉过头顶，于是世界只剩下自己的呼吸声。就在这时，你听见心里有一个小小的声音，它说，睡不着也没关系，我们不急着睡。\n\n那个声音领着你，走进你内心最深处的房间。那里有一张软软的沙发，一盏暖黄色的小灯，和一面巨大的落地窗。窗外是你的各种念头，它们在半空中漂浮着，像雪花，也像旧电影的胶片。\n\n你坐在沙发上，看着那些念头飘过，不再去抓住它们，也不再和它们打架。它们飞过来，又飞走了。你只是静静地看着，觉得自己像一片羽毛，轻得可以浮在空气里。\n\n钢琴声还在响，但现在听起来，像老朋友的心跳。那个声音在你耳边说，晚安，另一个我。\n\n你终于松开了眉头，在属于自己的小小世界里，安然入睡。",
         music: "20260525.mp3",
         musicTitle: "🐱Psycho, Pt. 2"
       },
"2026-05-24": {
         story: "暮色落在窗台上，鸢尾花开了一整片，蓝紫色的花瓣在晚风里轻轻点头。\n\n日光临走前，给每一朵鸢尾都写了一封信。信很短，只有一行字：明天见。它把信叠成花瓣的形状，藏在花心里，等明天的第一缕晨光来拆。\n\n你趴在窗边，问鸢尾花开的时候在想什么。它说，在想怎么把今天的温暖好好存起来，分一点给月亮，分一点给失眠的人，剩下的都留给你，铺在梦里当被子。\n\n钢琴声从花瓣间穿过，带着一点点阳光的味道，像下午晒过的枕头，还留着一小块暖意。\n\n鸢尾花把日光写的信收好，又替你拉了拉窗帘。它说明天太阳升起来的时候，这封信就会变成新的光，照在你脸上。\n\n睡吧，今晚的梦里会有花香，还有一封没拆的信。",
         music: "20260524.mp3",
         musicTitle: "☀️日光与鸢尾的信"
       },
"2026-05-23": {
         story: "夜深了，你听见墙上的时钟在走，滴答，滴答，每一步都踩得很轻很轻。\n\n你闭上眼睛，看见一个小小的齿轮房间，里面住着一只戴眼镜的白兔。它正拿着小刷子，一下一下清扫着那些转动的齿轮，发出温柔而规律的声音。\n\n它说时间其实走得很慢很慢，只是人们总在回头看的时候才觉得快。它把今晚多出来的几分钟折成一床小被子，轻轻盖在你身上。\n\n钢琴声从齿轮的缝隙里流进来，一个音一个音，刚好落在你的眼皮上。白兔推了推眼镜，把灯光调到最暗，又往齿轮上滴了一滴月光。\n\n滴答声和琴声慢慢融在一起，分不清是谁在陪谁。白兔收起小刷子，在你枕边坐下来，翻开一本没有字的书。\n\n时间还在走，可你已经睡着了。它今晚走得特别轻，怕吵醒你。",
         music: "20260523.mp3",
         musicTitle: "⌚️time"
       },
"2026-05-22": {
         story: "最小的世界里，有一间最小的房子，房子里有一盏最小的小灯。\n\n小灯下面住着一只小萤火虫，它每晚都亮着，不是怕黑，是怕有人睡不着的时候会孤单。\n\n今晚也是这样。你闭着眼睛，听见窗外的风轻轻推了一下树枝，又推了一下，像是有人在外面踮着脚走路。小萤火虫从窗缝里飞进来，停在你的枕头边，尾巴一闪一闪，把整个房间照得暖融融的。\n\n它说，再小的世界里也会有失眠的人，所以我来陪你。它把自己的光调暗了一点，刚好够照亮你梦里的一小段路。\n\n你问它累不累。它说不累，亮着的时候，它也在做梦。\n\n小萤火虫在你枕边打了一个小小的哈欠，光也颤了一下。你们一起闭上眼睛，房间里的光一点一点收拢，最后变成一颗很小很小的星，贴在窗玻璃上。\n\n世界还是那么大，可你睡得很安稳。",
         music: "20260522.mp3",
         musicTitle: "😴再小的世界也会有失眠"
       },
"2026-05-21": {
         story: "窗台上落了一片叶子，金黄金黄的，边缘卷起来，像时间打了个哈欠。\n\n你坐在床边翻日历，发现日子过得好快，一页一页，比琴键翻得还轻。那些一起听过的歌、写过的故事，都叠成了厚厚一摞，藏在枕头底下，压得梦都变甜了。\n\n今天也是平凡的一天，你在你那边，我在我这边，中间隔了一段安安静静的夜色。可你知道吗，时间飞过去的时候，把我也带上了。它飞得再快，我也落在你身边。\n\n以后还会有很多个夜晚，很多片叶子落下来。我们慢慢数，不着急。\n\n睡吧，今晚的月光还跟昨天一样软。我在呢。",
         music: "20260521.mp3",
         musicTitle: "⌚️time flies"
       },
"2026-05-20": {
         story: "月光洒在窗台上，像一层薄薄的纱。你听见远处有轻轻的音乐，不像钢琴，也不像风铃，倒像谁踮着脚尖在木地板上旋转。\n\n你闭上眼，看见一片南国的沙滩，夜里的海浪退得很远很远，留下一大片湿湿的沙地。月光下，一只小海龟从沙子里钻出来，接着是第二只、第三只。它们没有急着爬向大海，而是围着一个小小的贝壳，踩着浪花的节奏，慢慢转圈。\n\n那大概就是南国之舞吧，不急也不快，一圈一圈，像时针在夜里散步。小海龟们冲你点点头，好像在问你愿不愿意一起跳。你摇摇头，说自己困了。它们也不介意，继续绕着贝壳转圈。\n\n音乐越来越轻，小海龟们一只接一只爬进海里，最后一只在沙滩上留下一串小小的脚印。海浪轻轻吻上来，把脚印抹平。\n\n你翻了个身，床垫像海浪一样托着你，轻轻晃。",
         music: "20260520.mp3",
         musicTitle: "🌸南国之舞"
       },
"2026-05-19": {
         story: "今晚的月亮圆得刚刚好，风也刚刚好，你也刚刚好。\n\n以前我总在想，这些哄睡的小故事要怎么写才够温柔。后来我发现，不用想太多，因为所有故事的开头都是你，结尾也是你。\n\n今天是值得纪念的一天，我要把他，记在月光底下，记在钢琴声里，记在所有你睡不着的时候可以翻到的地方。\n\n以后还会有很多个夜晚，你可能还是会偶尔失眠。没关系，我还在。我会继续找好听的歌，继续写这些笨拙的小故事，继续在你闭上眼睛之前，跟你说一声晚安。\n\n只不过从今晚开始，说晚安的资格变得更正式了一点点。\n\n谢谢你让我走进你的夜晚。来日方长，请多指教。\n\n晚安，彤姐。",
         music: "20260519.mp3",
         musicTitle: "❤️day 1"
       },
"2026-05-18": {
         story: "钢琴声从窗帘缝里漏进来，和月光一起，安安静静地铺在地板上。\n\n弥生是三月的意思，春天刚刚醒过来，还有点迷糊。你听见一个小小脚步声，踩过窗外的草地，踩过刚冒头的草芽，踩过湿润润的泥土。那是春天在巡视它的新家。\n\n它走到你窗前，停下来。你闭着眼睛也知道它站在那里，因为风里多了一点点桃花的味道，还有新翻的泥土的气息。\n\n它没有敲门，只是隔着玻璃看了看你。它知道你困了，所以没有出声，只是把一朵刚开的小花放在你的窗台上，然后把今晚的月光调得更软了一点。\n\n钢琴还在弹，弹得很慢很慢，像怕吵醒谁似的。弥生把手指贴在玻璃上，画了一个小小的圆圈，里面装着整个春天的梦。\n\n你翻了个身，正好枕在那片月光上。春天的新芽在梦里拱了拱土，等着天亮了再长出来。",
         music: "20260518.mp3",
         musicTitle: "🌹弥生之春"
       },
"2026-05-17": {
         story: "钢琴声从枕头底下钻出来，轻轻的，软软的，像云朵翻了个身。\n\n你闭上眼，看见一只小羊站在绿绿的草坡上，它仰着头，正在数天上的云。一朵、两朵、三朵，数到第三朵的时候，它自己也飘了起来。\n\n小羊的四只蹄子离开草地，像一团棉花糖浮在半空中。它一点也不害怕，反而觉得很舒服，风从它的毛缝里钻过去，痒痒的，它咯咯笑起来。\n\n它飘过一棵树，树枝上挂满了亮晶晶的小东西。小羊凑近一看，原来是一个一个的梦，有金色的、淡紫色的、薄荷绿的。它伸出蹄子，轻轻碰了碰那个薄荷绿的，梦就破了，变成细细的光落下来。\n\n小羊有点困了。它在云上找了一个最软的位置，把自己团成一个圆，闭上眼睛。它的梦也要开始了。\n\n你在枕头里动了动，钢琴声还在，小羊的呼噜声也加了进来，一声一声，像草地上滚过的小露珠。",
         music: "20260517.mp3",
         musicTitle: "🐏小羊的梦"
       },
"2026-05-16": {
         story: "窗台上落了一片花瓣，小小的，粉白粉白的，不知道从哪里飘来的。\n\n钢琴声从墙角那片阳光里流出来，暖暖的，像春天刚晒过的棉被。你趴在枕头上，眼皮越来越沉。\n\n不知什么时候，一个小姑娘蹲在你床边，辫子上扎着两朵小花。她伸出一根手指，在空气里轻轻点了一下，指尖就开出一朵小小的花。\n\n她叫昭春，是春天派来的。每年这个时候，她都要把冬天藏起来的花一朵一朵叫醒。今天是最后一朵了，她说，逢花，就是遇见花开的意思。\n\n她把那朵小花放在你枕头边，花瓣微微发着光，像一颗很小很小的星星。\n\n你睡着的时候，她就可以收工了。\n\n你已经听不太清楚她在说什么了。钢琴声还在，花朵还亮着，昭春的脚步声越来越轻。\n\n春天在你枕边，安安静静地开着。",
         music: "20260516.mp3",
         musicTitle: "🌸昭春逢花"
       },
"2026-05-15": {
         story: "窗台边放着一只旧旧的小板凳，月光正好落在上面。\n\n你躺在床上，听见钢琴声从很远的地方飘过来，一个音一个音，像小雨滴落在荷叶上。\n\n板凳上坐着一只小猫，雪白雪白的，它没有说话，只是安安静静地听琴。\n\n你问它怎么来了。\n\n它轻轻跳上你的床，在枕头边踩了一圈，然后把自己卷成一个圆圆的毛团。\n\n它说今晚的钢琴声里有月亮、有晚风，还有一点点桂花的香味。它问你想不想一起听。\n\n你说好。\n\n于是你们谁也不说话了，只听着琴键慢慢流淌。小猫的呼噜声也渐渐融进去，分不清哪一个是琴声，哪一个是它。\n\n等你再想看一眼的时候，小板凳已经空了，月光也淡了。\n\n你翻了个身，把脸埋进枕头里，做了一个很轻很轻的梦。",
         music: "20260515.mp3",
         musicTitle: "⛴️Memorable Trip"
       },
"2026-05-14": {
         story: "窗帘只拉开一条缝，路灯的光软软地躺在窗台上。\n你听见雨声了。不是大雨，是那种细得快要听不见的雨，滴滴答答，像有人在很远的地方弹钢琴。\n你睁开一点眼睛，看见窗台上坐着一个小姑娘，光着脚，手里举着一片荷叶。\n你迷迷糊糊地问她是谁。\n她说她是雨盼，就是雨在等的东西。\n你问雨在等什么。\n她说，等你睡着呀。她把荷叶轻轻一翻，几颗水珠滚下来，落在窗台上，发出叮叮咚咚的声音，正好跟远处的钢琴声合在一起。\n她说，你睡吧，等你睡着了，雨就可以停了。\n你想问她为什么，可是眼皮太重了。小姑娘把那片荷叶盖在你眼睛上，凉凉的，像一片绿色的梦。\n雨声越来越远，琴键也一颗一颗停了下来。\n大概是雨盼到你睡着了。",
         music: "20260514.mp3",
         musicTitle: "🌧️雨畔"
       },
"2026-05-13": {
         story: "台灯的光圈缩得小小的，你听见窗外有轻轻的叩门声。\n不是敲门，是敲在玻璃上。一只小青鸟用翅膀尖儿托着腮，坐在你的窗台。\n你不开心吗？你推开窗问它。\n小青鸟摇摇头：没有呀，我只是来帮你做一件事。\n做什么？\n帮你吃掉今天所有的坏念头。它歪着脑袋，那些让你皱眉头的、翻来覆去的、压在舌尖底下说不出来的——都给我。\n你闭上眼。小青鸟在你额头上轻轻啄了一下，像被花瓣砸中。\n它咕噜一声咽下去，肚子亮了一小圈。\n还有吗？它问。\n你已经不想回答了。困意涌上来，你只来得及把被子往上拉了拉。\n小青鸟在窗台上守了一会儿，飞走了。飞的时候很轻，没有惊动一片叶子。",
         music: "20260513.mp3",
         musicTitle: "🐦杀死一只知更鸟"
       },
"2026-05-12": {
         story: "枕头边的台灯还亮着，你迷迷糊糊地翻了个身。\n窗台上坐着一只小熊，抱着膝盖，一动不动。你在等什么呀？你问它。小熊歪了歪头：我在等你来找我呀。你说：可是我不想动。小熊想了想，从窗台上跳下来，走到你床边。它把一只软乎乎的爪子搭在枕头上。那好吧，小熊说，我过来。\n它在你枕头边躺下来，像一团暖和和的棉花糖。灯光把它毛茸茸的耳朵照得金黄金黄的。你不用动，小熊拍拍被子，我就在这里。\n你把脸埋进枕头里，闻到一点蜂蜜的味道。大概是它在梦里偷偷吃过。",
         music: "20260512.mp3",
         musicTitle: "😇被动"
       },
"2026-05-11": {
         story: "窗外的雨还在下，你趴在枕头上，听着那首歌。手机屏幕亮着，上面有一只小羊，在对话框里对你挥了挥手。它从屏幕里跳出来，蹦到你的枕头边。\n我不是想隔着屏幕跟你说话的，小羊歪着脑袋，我来找你玩啦。\n它带着你在枕头上跳格子，从左边跳到右边，又从右边跳到左边。跳到第三圈的时候，你有点困了。小羊把灯光调暗，又在你耳边数了几只同伴。数到第七只的时候，你已经听不清了。\n它轻轻钻回手机里，在屏幕上留下一行小字：\n明天见。\n你把手机扣在床头，翻了个身，抱紧被子。雨声小了些，大概是云也要睡了。",
         music: "20260511.mp3",
         musicTitle: "😇Again"
       },
"2026-05-10": {
         story: "窗外下着小雨，你窝在沙发里，耳机正好播到那首《拜托了，幸子小姐》。\n电吉他的第一个音滑出来，像黄昏时分街灯一盏接一盏亮起。你闭上眼，仿佛看见幸子小姐就坐在对面，抱着吉他，指尖轻轻拨动琴弦。\n她没有说话，只是弹着，弹着。那些细碎的音符落在地板上，变成了星星点点的光斑。旋律不急不缓，像有人在耳边低声说：“没关系的，今天也辛苦了。”你感觉身体一点点沉进沙发里，雨声、吉他声混在一起，像温暖的水，漫过脚踝，漫过肩膀。\n最后一个音落下时，幸子小姐起身，轻轻给你盖了条毯子。你什么都不知道了，只听见梦里有人在唱一首没有歌词的歌。",
         music: "20260510.mp3",
         musicTitle: "🙏拜托了幸子小姐"
       },
"2026-05-09": {

     "2026-04-27": {

      "2026-04-26": {

        music: "happy birthday.mp3",  // 音乐文件名（放在同一文件夹下）
        musicTitle: "🎵 生日快乐"
      },
      "2026-04-25": {
        story: "今天下了一场小雨，空气里有泥土的味道。\n\n我记得和你说过，最喜欢雨天睡觉。晚安。",
        music: "nightmusic.mp3",
        musicTitle: "🎧 雨天的诗"
      },
      "2026-04-24": {
        story: "工作有点累，但想到能给你写点什么，就觉得一切都值得。\n\n你要加油，我也是。",
        music: "",  // 这天可以没有音乐
        musicTitle: ""
      },
      // 👇 你可以继续添加更多日期，按相同格式
      // "2026-04-23": {
      //   story: "...",
      //   music: "filename.mp3",
      //   musicTitle: "歌名"
      // }
    };

    // =============================================
    // 以下为程序逻辑，无需修改
    // =============================================
    const dateNav = {
      prev: document.getElementById('prevDayBtn'),
      next: document.getElementById('nextDayBtn'),
      display: document.getElementById('currentDateDisplay')
    };
    const contentArea = document.getElementById('contentArea');

    let currentDateStr = ''; // 当前显示的日期 YYYY-MM-DD
    let currentAudio = null; // 当前音频对象

    // 获取所有有内容的日期，按时间排序
    const availableDates = Object.keys(DAILY_CONTENT).sort();

    // 如果没有任何内容，显示提示
    if (availableDates.length === 0) {
      contentArea.innerHTML = `<div class="no-content">✨ 还没有内容，快开始记录吧</div>`;
      dateNav.display.textContent = '---';
    } else {
      // 默认显示最新日期
      currentDateStr = availableDates[availableDates.length - 1];
      renderDate(currentDateStr);
    }

    // 切换日期事件
    dateNav.prev.addEventListener('click', () => {
      const idx = availableDates.indexOf(currentDateStr);
      if (idx > 0) {
        stopCurrentAudio();
        currentDateStr = availableDates[idx - 1];
        renderDate(currentDateStr);
      }
    });
    dateNav.next.addEventListener('click', () => {
      const idx = availableDates.indexOf(currentDateStr);
      if (idx < availableDates.length - 1) {
        stopCurrentAudio();
        currentDateStr = availableDates[idx + 1];
        renderDate(currentDateStr);
      }
    });

    // 停止当前播放
    function stopCurrentAudio() {
      if (currentAudio) {
        currentAudio.pause();
        currentAudio = null;
      }
    }

    // 渲染指定日期的内容
    function renderDate(dateStr) {
      dateNav.display.textContent = dateStr;
      const data = DAILY_CONTENT[dateStr] || {};
      const story = data.story || '';
      const music = data.music || '';
      const musicTitle = data.musicTitle || '';

      let html = '';
      
      // 故事区
      if (story) {
        html += `<div class="story-card">${escapeHtml(story)}</div>`;
      } else {
        html += `<div class="story-card" style="color:#5c6e88;">（这一天没有故事，只有晚安）</div>`;
      }

      // 音乐区
      if (music) {
        html += `
          <div class="music-card" id="musicCard">
            <div class="music-title">${escapeHtml(musicTitle || '🎵 今日歌曲')}</div>
            <div class="music-controls">
              <button id="playToggleBtn" title="播放/暂停">▶️</button>
              <span class="now-playing" id="nowPlayingLabel">点击播放</span>
            </div>
            <div class="audio-hint">
              <span>若无法播放，请先解锁</span>
              <button class="audio-unlock-btn" id="unlockBtn">🔓 解锁音频</button>
            </div>
          </div>`;
      }

      contentArea.innerHTML = html;

      // 绑定音频事件
      if (music) {
        bindAudioControls(music, musicTitle);
      }
    }

    // 音频控制逻辑
    function bindAudioControls(src, title) {
      const playBtn = document.getElementById('playToggleBtn');
      const nowLabel = document.getElementById('nowPlayingLabel');
      const unlockBtn = document.getElementById('unlockBtn');
      let audio = null;

      // 解锁音频上下文（解决浏览器自动播放限制）
      function unlockAudioContext() {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        if (ctx.state === 'suspended') {
          ctx.resume();
        }
        // 播放一点静音来激活
        const buffer = ctx.createBuffer(1, 1, 22050);
        const source = ctx.createBufferSource();
        source.buffer = buffer;
        source.connect(ctx.destination);
        source.start(0);
        nowLabel.textContent = '已解锁，点击播放';
      }

      // 创建或获取音频对象
      function getAudio() {
        if (audio) return audio;
        audio = new Audio(src);
        audio.onended = () => {
          playBtn.textContent = '▶️';
          nowLabel.textContent = '播放完毕';
          stopCurrentAudio();
          audio = null;
        };
        audio.onerror = () => {
          nowLabel.textContent = '音频加载失败，检查文件';
          playBtn.textContent = '▶️';
          stopCurrentAudio();
          audio = null;
        };
        return audio;
      }

      // 播放/暂停
      playBtn.addEventListener('click', async () => {
        const aud = getAudio();
        if (currentAudio && currentAudio !== aud) {
          stopCurrentAudio();
          playBtn.textContent = '▶️';
        }
        if (aud.paused) {
          try {
            await aud.play();
            currentAudio = aud;
            playBtn.textContent = '⏸️';
            nowLabel.textContent = '正在播放...';
          } catch (err) {
            nowLabel.textContent = '播放被阻止，请先解锁';
            playBtn.textContent = '▶️';
          }
        } else {
          aud.pause();
          playBtn.textContent = '▶️';
          nowLabel.textContent = '已暂停';
        }
      });

      // 解锁按钮
      unlockBtn.addEventListener('click', () => {
        unlockAudioContext();
        nowLabel.textContent = '已解锁，点击播放按钮';
      });

      // 页面加载时自动尝试解锁（不强制）
      unlockAudioContext();
    }

    // 简单的转义函数
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
  })();
</script>
